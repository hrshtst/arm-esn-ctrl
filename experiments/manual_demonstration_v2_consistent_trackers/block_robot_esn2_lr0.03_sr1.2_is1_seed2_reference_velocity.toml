# The consistent search's ESN #2 (leak rate 0.03, spectral radius 1.2, input scaling 1,
# seed 2), against the replay of the take by time and by the arm's progress,
# with joint PD and computed torque at damping ratios 0.2, 0.4, and 0.8, given the
# reference's velocity,
# with the tip held from 4.5 s to 5.5 s, in mid-reach, then let go (report 005's
# block), from the take's start. See README.md.
#
#   uv run python experiments/robot_esn.py experiments/manual_demonstration_v2_consistent_trackers/block_robot_esn2_lr0.03_sr1.2_is1_seed2_reference_velocity.toml

[esn]
# A trained ESN: esn.toml in a run directory of experiments/autonomous_esn.py, relative to the
# storage root. The take it was trained on is the one the replays replay.
model = "results/manual_demonstration_v2_consistent_search/20261024-205835-esn2_lr0.03_sr1.2_is1_seed2/esn.toml"

[tracker]
# Part 2's trackers given the reference's velocity: joint PD and computed torque, each at
# omega = 20 rad/s and damping ratios 0.2, 0.4, and 0.8, their torque computed every
# 10 ms, the ESN's period, and held between. Joint PD at 0.4 is the search's tracker.
laws = ["pd", "computed_torque"]
omegas = [20.0]
dampings = [0.2, 0.4, 0.8]
acceleration_filter = 0.02  # time constant of the low-pass filter on the reference acceleration (s)
reference_velocity = true
control_period = 0.01  # the torque is computed this often and held between (s); the simulation step is 2 ms

[progress]
# A third arm, report 014's progress replay: the take replayed by time, but never more than
# lead_deg along its joint path past the arm's progress, the arm's nearest sample searched
# within window of the last one found.
lead_deg = 2.5
window = 1.0  # s

[evaluation]
duration = 24.0        # task (s), after the warm-up; the take lasts 18.5 s, and the last push comes at 15 s
hold = 2.0             # hold window after arrival (s): the hand must stay within the target tolerance
start_offsets_deg = [[0.0, 0.0]]  # the take's start
effort_window = [4.5, 6.0]  # torque, effort, and force: from the block's onset to 0.5 s after its release (s)
return_tolerance = 0.005  # after a disturbance, the hand is back once within this of the taught path (m)
ringing_cutoff_hz = 1.5   # after a disturbance, the hand's motion above this is its ringing (Hz); the trackers ring at about 3.1, 2.9, and 1.9 Hz at the three damping ratios
ringing_window = 2.0      # the ringing is measured over this long after the disturbance's end (s)
following_window = 0.5    # the following gain: from a disturbance's onset to this long after its end (s)

# Report 005's block.
[disturbance]
type = "block"
onset = 4.5            # task time when the tip is gripped (s)
release = 5.5          # task time when it is let go (s)
stiffness = 20000.0    # N/m
damping = 100.0        # N s/m
