# The equal gains: report 011's ESN #1 (leak rate 0.03, spectral radius 1.2, input
# scaling 1.5, seed 8), against the replay of the take, with joint PD at kp = 80 N
# m/rad and kd = 3 N m s/rad for both joints, given a zero reference velocity, its
# torque computed every 10 ms and held between, while the arm is still simulated every
# 2 ms: the tip held from 4.5 s to 5.5 s, in mid-reach, then let go, from the
# demonstrated start. As
# manual_demonstration_v2_robot_following_search/block_robot_lr0.03_sr1.2_is1.5_seed8_zero_velocity_filtered.toml
# otherwise.
#
#   uv run python experiments/robot_esn.py experiments/manual_demonstration_v2_robot_equal_gains/block_robot_lr0.03_sr1.2_is1.5_seed8_zero_velocity_filtered.toml

[esn]
# A trained ESN: esn.toml in a run directory of experiments/autonomous_esn.py,
# relative to the storage root. The demonstration it was trained on (that run's
# [demonstrations]) is the one the time-indexed baseline replays.
model = "results/manual_demonstration_v2_robot_following_search/20261014-155052-grid_lr0.03_sr1.2_is1.5_seed8_filtered/esn.toml"

[tracker]
# Joint PD with the same gains for both joints, given directly rather than by a natural
# frequency and damping ratio scaled by each joint's inertia; given a zero reference velocity.
laws = ["pd"]
kp = 80.0  # N m/rad, both joints
kd = 3.0   # N m s/rad, both joints
acceleration_filter = 0.02  # time constant of the low-pass filter on the reference acceleration (s)
reference_velocity = false
control_period = 0.01  # the torque is computed this often and held between (s); the simulation step is 2 ms

[evaluation]
duration = 24.0        # task (s), after the warm-up, as in the study's sweeps; the take lasts 18.5 s
hold = 2.0             # hold window after arrival (s): the hand must stay within the target tolerance
start_offsets_deg = [[0.0, 0.0]]  # the demonstrated start
effort_window = [4.5, 6.0]  # torque, effort, and force: from the block's onset to 0.5 s after its release (s)
return_tolerance = 0.005  # after a disturbance, the hand is back once within this of the taught path (m)
ringing_cutoff_hz = 1.5   # after a disturbance, the hand's motion above this is its ringing (Hz), as in reports 011 and 012
ringing_window = 2.0      # the ringing is measured over this long after the disturbance's end (s)
following_window = 0.5    # the following gain: from a disturbance's onset to this long after its end (s)

# Report 005's block, as in report 006.
[disturbance]
type = "block"
onset = 4.5            # task time when the tip is gripped (s)
release = 5.5          # task time when it is let go (s)
stiffness = 20000.0    # N/m
damping = 100.0        # N s/m
