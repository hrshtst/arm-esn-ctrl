# Stage 1: an ESN trained on one demonstration, run autonomously from a grid of
# start postures around the demonstrated one, with the settings found best for
# eight demonstrations (multi_demonstration_autonomous_reaching's
# autonomous_tvs_all_distances.toml).
#
#   uv run python experiments/autonomous_esn.py experiments/single_demonstration_autonomous_reaching/grid_multi_demo_settings.toml
#
# grid_single_demo_settings.toml runs the same grid with the settings first used
# for a single demonstration; each run is compared with the demonstrator's own
# reach from the same posture.

[demonstrations]
# A run directory of experiments/make_demonstrations.py, relative to the storage root:
# the time-varying-stiffness reach from one start posture (reach_tvs_single.toml).
run = "results/demonstrations/20261005-185525-reach_tvs_single"
train = ["demo_00.sklog.npz"]

[esn]
dt = 0.01              # sampling period (s)
warmup = 0.25          # the held start posture drives the ESN this long before it moves (s)
n_neurons = 600
spectral_radius = 1.3
sparsity = 0.1         # fraction of nonzero reservoir connections
leak_rate = 0.05
input_scaling = 0.1
bias = true
ridge = 1e-6
seed = 0

[evaluation]
duration = 5.0         # autonomous run (s); the demonstration lasts 4 s
hold = 2.0             # hold window after arrival (s): the hand must stay within the target tolerance
# Start postures: the demonstrated start offset by every combination of these
# offsets in each joint (deg), 13 x 13 = 169 starts. The demonstration covers
# only 30.4 deg of joint 1 and 22.7 deg of joint 2, so the outer offsets ask the
# ESN for joint angles well outside what it was trained on.
[evaluation.start_grid]
span_deg = 15.0        # offsets from -15 to 15 deg
step_deg = 2.5
