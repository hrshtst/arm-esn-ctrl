# Step C of the wider ESN search on the robot: the reservoir states of the chosen ESN
# (grid_lr0.03_sr1.35_is1.5_seed8_filtered.toml: leak rate 0.03, spectral radius
# 1.35, input scaling 1.5, seed 8) while it drives the robot in its validation runs,
# recomputed from the runs' logs, over its states while the take is fed in as in
# training: a few neurons over every whole run and, closer, through the warm-up, and
# the principal components of every run, warm-up included, with joint PD, the
# tracker of report 006's comparisons. As states_robot_fine_best_filtered.toml
# (report 005) otherwise.
#
#   uv run python experiments/robot_states.py experiments/manual_demonstration_v2_robot_search/states_robot_lr0.03_sr1.35_is1.5_seed8_filtered.toml

[states]
settings = ["pd_w20_z0.1"]  # tracker settings, as the runs name them: figures for each

[neurons]              # neurons_<setting>.png: every whole run; neurons_warmup_<setting>.png: the runs marked neurons = true
count = 8              # how many neurons are picked at random
seed = 0               # the seed of the pick
span = [-1.0, 3.0]     # time neurons_warmup_<setting>.png shows (s): the warm-up, from the reset, and the task's first seconds

[pca]                  # pca_<setting>.png and pca_planes_<setting>.png: every run, from the reset to its end
n_components = 3       # components shown; they are fitted on every run with every tracker setting

# The runs of experiments/robot_esn.py, relative to the storage root; they must share
# their ESN. Each is shown from one start posture: its index among the run's starts
# (the start column of its metrics.csv).

[[run]]
label = "undisturbed"
path = "results/manual_demonstration_v2_robot_search/20261013-114518-nominal_robot_lr0.03_sr1.35_is1.5_seed8_filtered"
start = 0
neurons = true         # also in neurons_warmup_<setting>.png

[[run]]
label = "the tip held, 4.5 s to 5.5 s"
path = "results/manual_demonstration_v2_robot_search/20261013-132857-block_robot_lr0.03_sr1.35_is1.5_seed8_filtered"
start = 0

[[run]]
label = "three pushes, at 4 s, 8 s, and 15 s"
path = "results/manual_demonstration_v2_robot_search/20261013-132857-pushes_robot_lr0.03_sr1.35_is1.5_seed8_filtered"
start = 0

[[run]]
label = "offset by +15 deg in both joints"
path = "results/manual_demonstration_v2_robot_search/20261013-114518-offsets_robot_lr0.03_sr1.35_is1.5_seed8_filtered"
start = 48
neurons = true

[[run]]
label = "offset by -10 deg in joint 2"
path = "results/manual_demonstration_v2_robot_search/20261013-114518-offsets_robot_lr0.03_sr1.35_is1.5_seed8_filtered"
start = 23
neurons = true
