# Step A of the wider ESN search on the robot: candidate #2 of stage 1
# (grid_lr0.03_sr1.35_is2_seed5_filtered.toml:
# leak rate 0.03, spectral radius 1.35, input scaling 2, seed 5) in report 005's
# validation scenarios: three pushes at the tip, at 4 s, 8 s, and 13 s, from the demonstrated start.
# As pushes_robot_fine_best_filtered.toml (report 005) otherwise.
#
#   uv run python experiments/robot_esn.py experiments/manual_demonstration_v2_robot_search/pushes_robot_lr0.03_sr1.35_is2_seed5_filtered.toml

[esn]
# A trained ESN: esn.toml in a run directory of experiments/autonomous_esn.py,
# relative to the storage root. The demonstration it was trained on (that run's
# [demonstrations]) is the one the time-indexed baseline replays.
model = "results/manual_demonstration_v2_robot_search/20261009-160946-grid_lr0.03_sr1.35_is2_seed5_filtered/esn.toml"

[tracker]
# Computed torque and joint PD at omega = 20 rad/s, underdamped (damping ratio 0.1),
# given a zero reference velocity, as in the sweeps on the robot.
laws = ["computed_torque", "pd"]
omegas = [20.0]
dampings = [0.1]
acceleration_filter = 0.02  # time constant of the low-pass filter on the reference acceleration (s)
reference_velocity = false

[evaluation]
duration = 22.0        # task (s), after the warm-up; the take lasts 18.5 s
hold = 2.0             # hold window after arrival (s): the hand must stay within the target tolerance
start_offsets_deg = [[0.0, 0.0]]  # the demonstrated start
# Without an effort_window, the torque, effort, and force are measured over the whole run.

# Each push: a force of `force` N for `duration` s from `onset` (task time, s), at
# `angle_deg` counterclockwise from the direction toward the target (0 forward, 90
# across, 180 backward), fixed for the run by the start posture.

[[disturbance]]  # nearly backward: 10 deg off it, toward clockwise across
type = "push"
force = 4.0            # EDIT: N
onset = 4.0            # EDIT: task time (s)
duration = 0.2         # s
angle_deg = -170.0     # deg from the direction toward the target

[[disturbance]]  # nearly across, counterclockwise: 10 deg off it, toward the target
type = "push"
force = 5.0            # EDIT: N
onset = 8.0            # EDIT: task time (s)
duration = 0.2         # s
angle_deg = 80.0       # deg from the direction toward the target

[[disturbance]]  # nearly across, clockwise, after the hold: 10 deg off it, toward the target
type = "push"
force = 4.0            # EDIT: N
onset = 13.0           # EDIT: task time (s)
duration = 0.2         # s
angle_deg = -80.0      # deg from the direction toward the target
