# Step A of the wider ESN search on the robot: candidate #6 of stage 1
# (grid_lr0.1_sr1.2_is1.5_seed4_filtered.toml:
# leak rate 0.1, spectral radius 1.2, input scaling 1.5, seed 4) in report 005's
# validation scenarios: the tip held by a stiff spring-damper from 4.5 s to 5.5 s,
# in mid-reach, then let go, from the demonstrated start.
# As block_robot_fine_best_filtered.toml (report 005) otherwise.
#
#   uv run python experiments/robot_esn.py experiments/manual_demonstration_v2_robot_search/block_robot_lr0.1_sr1.2_is1.5_seed4_filtered.toml

[esn]
# A trained ESN: esn.toml in a run directory of experiments/autonomous_esn.py,
# relative to the storage root. The demonstration it was trained on (that run's
# [demonstrations]) is the one the time-indexed baseline replays.
model = "results/manual_demonstration_v2_robot_search/20261009-160946-grid_lr0.1_sr1.2_is1.5_seed4_filtered/esn.toml"

[tracker]
# Computed torque and joint PD at omega = 20 rad/s, underdamped (damping ratio 0.1),
# given a zero reference velocity, as in nominal_test_filtered.toml and the sweeps.
laws = ["computed_torque", "pd"]
omegas = [20.0]
dampings = [0.1]
acceleration_filter = 0.02  # time constant of the low-pass filter on the reference acceleration (s)
reference_velocity = false

[evaluation]
duration = 22.0        # task (s), after the warm-up, as in the sweeps; the take lasts 18.5 s
hold = 2.0             # hold window after arrival (s): the hand must stay within the target tolerance
start_offsets_deg = [[0.0, 0.0]]  # the demonstrated start
effort_window = [4.5, 6.0]  # torque, effort, and force are measured from the block's onset to 0.5 s after its release (s)

[disturbance]
type = "block"
onset = 4.5            # task time when the tip is gripped (s)
release = 5.5          # task time when it is let go (s)
stiffness = 20000.0    # N/m
damping = 100.0        # N s/m
