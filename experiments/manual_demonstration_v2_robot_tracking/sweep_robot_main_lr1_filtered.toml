# ESN sweep on the robot, stage 1: the input scaling and the spectral radius,
# below 1, at leak rate 1; the sweeps at the other leak rates complete the
# main parameters (leak rates 0.1, 0.2, 0.3, 0.5, 0.7, and 1).
#
#   uv run python experiments/sweep_robot_esn.py experiments/manual_demonstration_v2_robot_tracking/sweep_robot_main_lr1_filtered.toml
#
# Every combination is trained on the v2 take filtered at 2 Hz and generates the
# reference of the simulated arm from the demonstrated start, undisturbed, with
# each tracker setting. The combinations are ranked by their failed runs (never
# arriving, leaving the goal, or holding under 2 s), then by the worst path RMSE
# of their runs from the taught motion, regardless of timing.

[demonstrations]
# A run directory of experiments/import_demonstrations.py, relative to the storage
# root: the take of reach_manual_v2.toml, filtered at 2 Hz.
run = "results/demonstrations/20261008-170034-reach_manual_v2"
train = ["demo_00_filtered.sklog.npz"]

[esn]
# The settings not swept, those of grid_test_filtered.toml; a swept key's value
# here is replaced by each swept value.
dt = 0.01              # sampling period (s)
warmup = 1.0           # the held start posture drives the ESN this long before it moves (s)
n_neurons = 400
spectral_radius = 0.95
sparsity = 0.05        # fraction of nonzero reservoir connections
leak_rate = 1.0
input_scaling = 0.1
bias = true
ridge = 1e-2
seed = 0

[sweep]
# The first two are the heatmap axes (x, then y).
input_scaling = [0.03, 0.1, 0.3, 0.6, 1.0, 1.5]
spectral_radius = [0.5, 0.7, 0.85, 0.95, 0.99]

[tracker]
# The tracker of nominal_test_filtered.toml: computed torque and joint PD at
# omega = 20 rad/s, underdamped (damping ratio 0.1), given a zero reference velocity.
laws = ["computed_torque", "pd"]
omegas = [20.0]
dampings = [0.1]
acceleration_filter = 0.02  # time constant of the low-pass filter on the reference acceleration (s)
reference_velocity = false

[evaluation]
# 22 s: the take lasts 18.5 s, and with this tracker grid_test_filtered's ESN
# arrives at about 19 s; the whole 2 s hold window must fit in the run.
duration = 22.0
hold = 2.0             # hold window after arrival (s): the hand must stay within the target tolerance
start_offsets_deg = [[0.0, 0.0]]  # the demonstrated start
