# The fine search: 81 settings around the best of the coarse search (run
# 20261119-190537-coarse_search: leak rate 0.1, spectral radius 1.5, input scaling 0.5,
# ridge 1; 15 of its 17 runs pass, 8 of the 9 reaches hold and 7 of the 8 ellipse runs
# cycle, median detour ratio 1.040, median curve RMS 8.55 mm; no coarse setting passes
# all 17), five reservoirs each (seeds 1 to 5). Each ESN is trained on stage 1's nine
# takes of the reach, with the context reach, and on the take of the ellipse by hand,
# with the context ellipse, and run on the robot, undisturbed, with each context from
# that task's starts: the reach from the nine takes' starts for 24 s, and the ellipse
# from the eight starts on the curve for 40 s. Each setting is scored over the 85 runs
# of its five seeds by how many pass, then, among the settings with as many, by the
# worse of two ranks, by the median detour ratio of its reach runs that arrive and by
# the median curve RMS of its ellipse runs that cycle, then by the better; the 20 best
# are scored again with the untaught starts. It is coarse_search.toml but for the
# values and the seeds. About 85 minutes with 30 workers: 405 ESNs, where the coarse
# search's 108 took 22 minutes. See README.md.
#
#   uv run python experiments/sweep_robot_esn.py \
#       experiments/manual_demonstration_v2_reach_and_ellipse/fine_search.toml --workers 30

[[demonstrations]]
# Stage 1's nine takes of reach_manual_v2_no_limits.toml, filtered at 2 Hz.
context = "reach"
run = "results/demonstrations/20261117-164658-reach_manual_v2_no_limits"
train = [
  "demo_00_filtered.sklog.npz",  # from (13, 71) deg
  "demo_01_filtered.sklog.npz",  # from (73, 71)
  "demo_02_filtered.sklog.npz",  # from (133, 71)
  "demo_03_filtered.sklog.npz",  # from (-167, 71)
  "demo_04_filtered.sklog.npz",  # from (-107, 71)
  "demo_05_filtered.sklog.npz",  # from (-47, 71)
  "demo_06_filtered.sklog.npz",  # from (21, 132)
  "demo_07_filtered.sklog.npz",  # from (141, 132)
  "demo_08_filtered.sklog.npz",  # from (-99, 132)
]

[[demonstrations]]
# Stage 3a's take of the ellipse by hand, ten loops, filtered at 2 Hz: the run directory
# of experiments/import_demonstrations.py for ellipse_manual_v2_no_limits.toml.
context = "ellipse"
run = "results/demonstrations/20261119-093746-ellipse_manual_v2_no_limits"
train = ["demo_00_filtered.sklog.npz"]

[esn]
dt = 0.01              # sampling period (s)
warmup = 1.0           # the held start posture drives the ESN this long before it moves (s)
n_neurons = 800
spectral_radius = 1.5  # swept; the center's
sparsity = 0.05        # fraction of nonzero reservoir connections
leak_rate = 0.1        # swept; the center's
input_scaling = 0.5    # swept; the center's
bias = true
ridge = 1.0            # swept; the center's
seed = 1               # swept
# The context, one value per task after the joint angles, is fed in divided by the
# input scaling, so that its input weights have the scale 1 whatever the input scaling
# is, as in stage 2. Not swept.
context_scaling = 1.0
context_times_input_scaling = false

[sweep]
# The center's value, and the one halfway to its coarse neighbor on each side: in ratio
# for the leak rate (0.03 and 0.3), the input scaling (0.1 and 2), and the ridge, in
# difference for the spectral radius, to two digits. The center's spectral radius and
# ridge are the coarse grid's largest, so the value above each is as far from the center
# as the one below: 1.65 as 1.35 (from 1.2), and 10, in ratio, as 0.1 (from 1e-2).
leak_rate = [0.055, 0.1, 0.17]
spectral_radius = [1.35, 1.5, 1.65]
input_scaling = [0.22, 0.5, 1.0]
ridge = [0.1, 1.0, 10.0]
seed = [1, 2, 3, 4, 5]

[ranking]
# The most runs that pass, then the worse of the two ranks among the settings with as
# many, by the median detour ratio of the reach runs that arrive and by the median curve
# RMS of the ellipse runs that cycle, then the better.
by = "worse_rank"

[tracker]
# The consistent search's tracker (report 017): joint PD at omega = 20 rad/s and a
# damping ratio of 0.4, given the reference's velocity, its torque computed every 10 ms
# and held between. Its gains are set where the take of reports 005 to 020 ends,
# whatever takes the ESN was trained on, so that every ESN is tracked alike.
laws = ["pd"]
omegas = [20.0]
dampings = [0.4]
acceleration_filter = 0.02  # time constant of the low-pass filter on the reference acceleration (s)
reference_velocity = true
control_period = 0.01  # the torque is computed this often and held between (s); the simulation step is 2 ms
gains_from = "results/demonstrations/20261008-170034-reach_manual_v2/demo_00_filtered.sklog.npz"

# Each task's runs, as in the stage it comes from: stage 1's coarse search for the
# reach, stage 3a's for the ellipse.

[evaluation.tasks.reach]
duration = 24.0        # task (s), after the warm-up
hold = 2.0             # hold window after arrival (s): the hand must stay within the target tolerance
start_offsets_deg = [[0.0, 0.0]]  # each take's own start

[evaluation.tasks.ellipse]
duration = 40.0           # task (s), after the warm-up: about eight taught periods
# A run cycles if, over its last cycle_periods taught periods, the hand's angle about
# the curve's center grows by cycle_turns turns, five at the taught pace, and the RMS
# of its distance from the curve, the ellipse itself, is at most curve_tolerance,
# stage 1's goal radius.
curve_tolerance = 0.02    # m
cycle_periods = 5
cycle_turns = [4.0, 6.0]  # the least and the most
start_offsets_deg = [[0.0, 0.0]]  # the take's own start: the hand on the curve at its angle 0

[evaluation.tasks.ellipse.extra_starts]
# The other seven starts on the curve (deg): the hand on the ellipse at the curve's
# angles 45, 90, ..., 315 deg, an eighth of a loop apart; joint 2 positive, as at the
# take's start, rounded to 0.1 deg.
on_curve = [
  [47.3, 90.8], [62.6, 83.0], [75.1, 82.6], [79.0, 92.5], [71.5, 109.8], [53.3, 122.5], [36.2, 118.7],
]
