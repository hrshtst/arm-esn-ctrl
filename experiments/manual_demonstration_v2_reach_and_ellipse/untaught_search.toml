# The fine search's 20 best settings, scored again with the start postures no take
# starts from: each with its five reservoirs (seeds 1 to 5), on the robot,
# undisturbed, with each context from that task's starts and from stage 1's 36
# untaught starts, the reach from the nine takes' starts for 24 s and the ellipse from
# the eight starts on the curve for 40 s: 45 runs and 44, 89 an ESN and 445 a setting.
# No fine setting passes all 85 of its runs; the best two pass 69, and the 20th passes
# 51, as does the 21st (leak rate 0.055, spectral radius 1.35, input scaling 0.22,
# ridge 10), which the ranks leave out. Each setting is scored over its 445 runs as in
# the fine search, by how many pass, then, among the settings with as many, by the
# worse of its two ranks, then by the better; two-task ESN #1 and ESN #2 are the
# typical seeds of the two best. It is fine_search.toml but for the settings and the
# untaught starts. About 80 minutes with 30 workers: 100 ESNs with 89 runs each, where
# the fine search's 405 with 17 runs each took 61 minutes. See README.md.
#
#   uv run python experiments/sweep_robot_esn.py \
#       experiments/manual_demonstration_v2_reach_and_ellipse/untaught_search.toml --workers 30

# The fine search's 20 best settings (run 20261119-193314-fine_search), in its order,
# each with its runs that pass there, of 85 (the reach's of 45 + the ellipse's of 40).
settings = [
  { leak_rate = 0.055, spectral_radius = 1.65, input_scaling = 0.5, ridge = 10.0 },  # 69 (33 + 36)
  { leak_rate = 0.17, spectral_radius = 1.65, input_scaling = 0.22, ridge = 10.0 },  # 69 (35 + 34)
