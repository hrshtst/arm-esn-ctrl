# Stage 1: sweep the reservoir size, spectral radius, and warm-up of the ESN
# trained on all eight demonstrations.
#
#   uv run python experiments/sweep_esn.py experiments/multi_demonstration_autonomous_reaching/sweep_tvs_all_reservoir.toml
#
# Ridge, leak rate, and input scaling are fixed at the best combination of the
# ridge / leak rate / input scaling sweep (sweep_tvs_all.toml, run
# 20261002-201614): ridge 1e-6, leak rate 0.05, input scaling 0.1. Everything
# else is sweep_tvs_all.toml.

[demonstrations]
# A run directory of experiments/make_demonstrations.py, relative to the storage root.
run = "results/demonstrations/20261002-194644-reach_tvs"
train = [
  "demo_00.sklog.npz",
  "demo_01.sklog.npz",
  "demo_02.sklog.npz",
  "demo_03.sklog.npz",
  "demo_04.sklog.npz",
  "demo_05.sklog.npz",
  "demo_06.sklog.npz",
  "demo_07.sklog.npz",
]

[esn]
dt = 0.01              # sampling period (s)
warmup = 1.0           # swept: the held start posture drives the ESN this long before it moves (s)
n_neurons = 300        # swept
spectral_radius = 0.5  # swept
sparsity = 0.1         # fraction of nonzero reservoir connections
leak_rate = 0.05
input_scaling = 0.1
bias = true
ridge = 1e-6
seed = 0

[sweep]
# The first two are the heatmap axes (x, then y); each value of the third gets its own column.
n_neurons = [150, 200, 300, 400, 600, 800]
spectral_radius = [0.1, 0.3, 0.5, 0.7, 0.9, 1.1, 1.3, 1.5]
warmup = [0.0, 0.25, 0.5, 1.0, 1.5, 2.5]

[evaluation]
duration = 5.0         # autonomous run (s); the demonstrations last 4 s
hold = 2.0             # hold window after arrival (s): the hand must stay within the target tolerance
# Start postures: each demonstration's start plus these offsets (deg).
start_offsets_deg = [[0.0, 0.0]]
# Start postures no demonstration starts from, by group (joint angles in degrees).
[evaluation.extra_starts]
# 0.5 m from the target, halfway between the demonstrated directions.
between = [
  [40.5, 71.4],   # hand ( 0.46, 1.39) m,  22.5 deg
  [64.2, 43.6],   # hand ( 0.19, 1.66) m,  67.5 deg
  [77.3, 43.6],   # hand (-0.19, 1.66) m, 112.5 deg
  [77.2, 71.4],   # hand (-0.46, 1.39) m, 157.5 deg
  [70.4, 104.8],  # hand (-0.46, 1.01) m, 202.5 deg
  [52.7, 131.4],  # hand (-0.19, 0.74) m, 247.5 deg
  [23.6, 131.4],  # hand ( 0.19, 0.74) m, 292.5 deg
  [21.2, 104.8],  # hand ( 0.46, 1.01) m, 337.5 deg
]
