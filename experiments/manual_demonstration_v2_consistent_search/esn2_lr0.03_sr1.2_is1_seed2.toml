# The consistent search's ESN #2, its setting ranked second of the eleven that qualify
# by the rule (median following 0.74, median ringing 5.72 mm): leak rate 0.03, spectral
# radius 1.2, input scaling 1, and seed 2, its setting's typical seed (step 2's select
# run 20261024-205520-select). Trained and run on its own here from the 49 offset
# starts, so that its ESN is saved for robot_esn.py and the robot app. See README.md.
#
#   uv run python experiments/autonomous_esn.py experiments/manual_demonstration_v2_consistent_search/esn2_lr0.03_sr1.2_is1_seed2.toml

[demonstrations]
# A run directory of experiments/import_demonstrations.py, relative to the storage
# root: the take of reach_manual_v2.toml, filtered at 2 Hz.
run = "results/demonstrations/20261008-170034-reach_manual_v2"
train = ["demo_00_filtered.sklog.npz"]

[esn]
dt = 0.01              # sampling period (s)
warmup = 1.0           # the held start posture drives the ESN this long before it moves (s)
n_neurons = 400
spectral_radius = 1.2
sparsity = 0.05        # fraction of nonzero reservoir connections
leak_rate = 0.03
input_scaling = 1
bias = true
ridge = 1e-2
seed = 2

[evaluation]
duration = 20.0        # autonomous run (s); the take lasts 18.5 s
hold = 2.0             # hold window after arrival (s): the hand must stay within the target tolerance
[evaluation.start_grid]
span_deg = 15.0        # the demonstrated start offset by -15 to 15 deg in each joint, every 5 deg (49 start postures)
step_deg = 5.0
