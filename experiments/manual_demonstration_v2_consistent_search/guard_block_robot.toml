# The rule's guard: how much the replay rings with the search's tracker with the tip
# held from 4.5 s to 5.5 s, in mid-reach, then let go (report 005's block), from the
# take's start. Its ESN, report 011's ESN #1, only runs beside it, since the replay does
# not depend on the ESN, and repeats its run with the same tracker in report 011 (see
# README.md, step 0).
#
#   uv run python experiments/robot_esn.py experiments/manual_demonstration_v2_consistent_search/guard_block_robot.toml

[esn]
# Report 011's ESN #1: leak rate 0.03, spectral radius 1.2, input scaling 1.5, seed 8.
model = "results/manual_demonstration_v2_robot_following_search/20261014-155052-grid_lr0.03_sr1.2_is1.5_seed8_filtered/esn.toml"

[tracker]
# The search's tracker: joint PD at omega = 20 rad/s and a damping ratio of 0.4, given
# the reference's velocity, its torque computed every 10 ms, the ESN's period, and
# held between.
laws = ["pd"]
omegas = [20.0]
dampings = [0.4]
acceleration_filter = 0.02  # time constant of the low-pass filter on the reference acceleration (s)
reference_velocity = true
control_period = 0.01  # the torque is computed this often and held between (s); the simulation step is 2 ms

[evaluation]
duration = 24.0        # task (s), after the warm-up; the take lasts 18.5 s, and the last push comes at 15 s
hold = 2.0             # hold window after arrival (s): the hand must stay within the target tolerance
start_offsets_deg = [[0.0, 0.0]]  # the take's start
effort_window = [4.5, 6.0]  # torque, effort, and force: from the block's onset to 0.5 s after its release (s)
return_tolerance = 0.005  # after a disturbance, the hand is back once within this of the taught path (m)
ringing_cutoff_hz = 1.5   # after a disturbance, the hand's motion above this is its ringing (Hz); the tracker rings at 2.9 Hz
ringing_window = 2.0      # the ringing is measured over this long after the disturbance's end (s)
following_window = 0.5    # the following gain: from a disturbance's onset to this long after its end (s)

# Report 005's block.
[disturbance]
type = "block"
onset = 4.5            # task time when the tip is gripped (s)
release = 5.5          # task time when it is let go (s)
stiffness = 20000.0    # N/m
damping = 100.0        # N s/m
