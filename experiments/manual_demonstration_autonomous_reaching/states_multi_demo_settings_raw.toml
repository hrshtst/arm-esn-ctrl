# Stage 1, Phase 2, with a demonstration taught by hand: the reservoir states of the
# ESN trained on the take as recorded with the settings found best for eight
# demonstrations (grid_multi_demo_settings_raw.toml), compared by principal
# components.
#
#   uv run python experiments/reservoir_states.py experiments/manual_demonstration_autonomous_reaching/states_multi_demo_settings_raw.toml
#
# The states while the take is fed in (teacher forcing) give the principal
# components; the autonomous runs from the same grid of start postures as Phase 1
# are projected onto them and compared with the take's states over time.
# states_multi_demo_settings_filtered.toml does the same for the ESN trained on the
# filtered take.

[esn]
# The trained ESN: esn.toml of the Phase 1 run, relative to the storage root. Its
# run directory names the demonstration it was trained on.
model = "results/manual_demonstration_autonomous_reaching/20261006-153139-grid_multi_demo_settings_raw/esn.toml"

[evaluation]
duration = 14.8        # autonomous run (s): as long as the demonstration, so every state has one to compare with
[evaluation.start_grid]
span_deg = 15.0        # the start offsets of Phase 1: -15 to 15 deg in each joint
step_deg = 2.5

[states]
n_components = 10      # principal components each state is projected onto (projections.npz)
join_threshold = 0.1   # a run joins the demonstration's states once the time-matched distance stays below this
phase_window = [4.1, 7.3]  # the phase lead is the median over these times (s): the reach, from heading for the target to arriving
# The start offsets (deg) whose runs pca.png and convergence.png draw: the outer ring of the grid.
shown_offsets_deg = [
  [15.0, 0.0], [-15.0, 0.0], [0.0, 15.0], [0.0, -15.0],
  [15.0, 15.0], [15.0, -15.0], [-15.0, 15.0], [-15.0, -15.0],
]
