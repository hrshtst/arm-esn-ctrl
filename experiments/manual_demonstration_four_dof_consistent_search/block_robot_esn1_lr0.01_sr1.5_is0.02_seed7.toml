# The four-link consistent search's ESN #1 (leak rate 0.01, spectral radius 1.5, input
# scaling 0.02, seed 7), as the rule chose it, against the replay of the take by time
# and by the arm's progress, with the search's tracker, with the tip held from 4.0 s to
# 5.0 s, in mid-reach, then let go (v2's block), from the take's start. See README.md,
# step 4.
#
#   uv run python experiments/robot_esn.py experiments/manual_demonstration_four_dof_consistent_search/block_robot_esn1_lr0.01_sr1.5_is0.02_seed7.toml

[esn]
# A trained ESN: esn.toml in a run directory of experiments/autonomous_esn.py, relative to the
# storage root. The take it was trained on is the one the replays replay.
model = "results/manual_demonstration_four_dof_consistent_search/20261108-201626-esn1_lr0.01_sr1.5_is0.02_seed7/esn.toml"

[tracker]
# The search's tracker: joint PD at omega = 20 rad/s and a damping ratio of 0.4, its
# gains the whole mass matrix M at the take's final posture (Kp = omega^2 M and
# Kd = 2 zeta omega M), given the reference's velocity, its torque computed every
# 10 ms, the ESN's period, and held between.
laws = ["pd"]
omegas = [20.0]
dampings = [0.4]
mass_matrix = true
acceleration_filter = 0.02  # time constant of the low-pass filter on the reference acceleration (s)
reference_velocity = true
control_period = 0.01  # the torque is computed this often and held between (s); the simulation step is 2 ms

[progress]
# A third arm, report 014's progress replay: the take replayed by time, but never more than
# lead_deg along its joint path past the arm's progress, the arm's nearest sample searched
# within window of the last one found.
lead_deg = 2.5
window = 1.0  # s

[evaluation]
duration = 23.9        # task (s), after the warm-up; the take lasts 21.4 s, and the last push comes at 14.9 s
hold = 2.0             # hold window after arrival (s): the hand must stay within the target tolerance
start_offsets_deg = [[0.0, 0.0, 0.0, 0.0]]  # the take's start
effort_window = [4.0, 5.5]  # torque, effort, and force: from the block's onset to 0.5 s after its release (s)
return_tolerance = 0.005  # after a disturbance, the hand is back once within this of the taught path (m)
ringing_cutoff_hz = 1.5   # after a disturbance, the hand's motion above this is its ringing (Hz); the tracker rings at 2.9 Hz
ringing_window = 2.0      # the ringing is measured over this long after the disturbance's end (s)
following_window = 0.5    # the following gain: from a disturbance's onset to this long after its end (s)

# v2's block (report 005's), at this take's time.
[disturbance]
type = "block"
onset = 4.0            # task time when the tip is gripped (s): the take's hand is 32% of the way to the target
release = 5.0          # task time when it is let go (s)
stiffness = 20000.0    # N/m
damping = 100.0        # N s/m
