[rule]
chosen = 2
fallback_seeds = 8                     # none is left below the qualifying seeds
qualifying_seeds = 8                   # a setting qualifies with this many of its 10 seeds passing
excuse_leaving = ["pushes", "offsets"] # leaving the goal during the hold is excused here: the hand must still arrive and end in the goal
max_block_gap = 0.5                    # the reference's distance from the arm's joint angles at the block's release, over the replay's
rank_by = "block_gap"                  # the smallest median first
