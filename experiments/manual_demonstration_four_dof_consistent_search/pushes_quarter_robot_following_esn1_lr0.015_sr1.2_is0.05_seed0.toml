# The four-link consistent search's ESN #1 by step 5's rule (leak rate 0.015, spectral radius 1.2, input
# scaling 0.05, seed 0), as the rule chose it, against the replay of the take by time
# and by the arm's progress, with the search's tracker, under step 5's three pushes of 0.5 s
# at the tip, forward at 2.6 s, across at 6.7 s, and across again at 14.9 s, after the
# hold, with every force at a quarter of step 5's, from the take's start. See README.md, step 6.
#
#   uv run python experiments/robot_esn.py experiments/manual_demonstration_four_dof_consistent_search/pushes_quarter_robot_following_esn1_lr0.015_sr1.2_is0.05_seed0.toml

[esn]
# A trained ESN: esn.toml in a run directory of experiments/autonomous_esn.py, relative to the
# storage root. The take it was trained on is the one the replays replay.
model = "results/manual_demonstration_four_dof_consistent_search/20261109-203149-following_esn1_lr0.015_sr1.2_is0.05_seed0/esn.toml"

[tracker]
# The search's tracker: joint PD at omega = 20 rad/s and a damping ratio of 0.4, its
# gains the whole mass matrix M at the take's final posture (Kp = omega^2 M and
# Kd = 2 zeta omega M), given the reference's velocity, its torque computed every
# 10 ms, the ESN's period, and held between.
laws = ["pd"]
omegas = [20.0]
dampings = [0.4]
mass_matrix = true
acceleration_filter = 0.02  # time constant of the low-pass filter on the reference acceleration (s)
reference_velocity = true
control_period = 0.01  # the torque is computed this often and held between (s); the simulation step is 2 ms

[progress]
# A third arm, report 014's progress replay: the take replayed by time, but never more than
# lead_deg along its joint path past the arm's progress, the arm's nearest sample searched
# within window of the last one found.
lead_deg = 2.5
window = 1.0  # s

[evaluation]
duration = 23.9        # task (s), after the warm-up; the take lasts 21.4 s, and the last push comes at 14.9 s
hold = 2.0             # hold window after arrival (s): the hand must stay within the target tolerance
start_offsets_deg = [[0.0, 0.0, 0.0, 0.0]]  # the take's start
return_tolerance = 0.005  # after a disturbance, the hand is back once within this of the taught path (m)
ringing_cutoff_hz = 1.5   # after a disturbance, the hand's motion above this is its ringing (Hz); the tracker rings at 2.9 Hz
ringing_window = 2.0      # the ringing is measured over this long after the disturbance's end (s)
following_window = 0.5    # the following gain: from a disturbance's onset to this long after its end (s)

# Step 5's pushes, at a quarter of their force. Each: a force of `force` N for
# `duration` s from `onset` (task time, s), at `angle_deg` counterclockwise from the
# direction toward the target (0 forward, 90 across, 180 backward), fixed for the run by
# the start posture.

[[disturbance]]  # nearly forward: 10 deg off it, toward counterclockwise across
type = "push"
force = 0.75           # N: a quarter of 3 N
onset = 2.6            # task time (s): the take's hand is 18% of the way to the target
duration = 0.5         # s
angle_deg = 10.0       # deg from the direction toward the target

[[disturbance]]  # nearly across, counterclockwise: 10 deg off it, toward the target
type = "push"
force = 1.25           # N: a quarter of 5 N
onset = 6.7            # task time (s): 62% of the way, and done 2.3 s before the take arrives
duration = 0.5         # s
angle_deg = 80.0       # deg from the direction toward the target

[[disturbance]]  # nearly across, clockwise, after the hold: 10 deg off it, toward the target
type = "push"
force = 1.0            # N: a quarter of 4 N
onset = 14.9           # task time (s): 5.4 s after the take arrives
duration = 0.5         # s
angle_deg = -80.0      # deg from the direction toward the target
