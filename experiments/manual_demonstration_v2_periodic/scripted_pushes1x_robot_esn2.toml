# The scripted take's ESN #2 on the robot under report 007's three pushes at their
# original forces, from the eight starts on the curve, against the replay of its take,
# which goes on without end through the take's taught loop: claim 4. The runs last 80 s,
# 47 s after the last push. About 7 minutes: 16 runs of 80 s, one after another. See
# README.md.
#
#   uv run python experiments/robot_esn.py experiments/manual_demonstration_v2_periodic/scripted_pushes1x_robot_esn2.toml

[esn]
# A trained ESN: esn.toml in a run directory of experiments/autonomous_esn.py, relative
# to the storage root.
model = "results/manual_demonstration_v2_periodic/YYYYMMDD-HHMMSS-scripted_esn2/esn.toml"  # EDIT: the ESN's run

[tracker]
# The consistent search's tracker (report 017): joint PD at omega = 20 rad/s and a
# damping ratio of 0.4, given the reference's velocity, its torque computed every 10 ms
# and held between. Its gains are set where the take of reports 005 to 020 ends,
# whatever takes the ESN was trained on, so that every ESN is tracked alike.
laws = ["pd"]
omegas = [20.0]
dampings = [0.4]
acceleration_filter = 0.02  # time constant of the low-pass filter on the reference acceleration (s)
reference_velocity = true
control_period = 0.01  # the torque is computed this often and held between (s); the simulation step is 2 ms
gains_from = "results/demonstrations/20261008-170034-reach_manual_v2/demo_00_filtered.sklog.npz"

[evaluation]
duration = 80.0           # task (s), after the warm-up: 20 taught periods; the last push comes at 33 s
# A run cycles if, over its last cycle_periods taught periods, the hand's angle about
# the curve's center grows by cycle_turns turns, five at the taught pace, and the RMS
# of its distance from the curve, the ellipse itself, is at most curve_tolerance,
# stage 1's goal radius.
curve_tolerance = 0.02    # m
cycle_periods = 5
cycle_turns = [4.0, 6.0]  # the least and the most
start_offsets_deg = [[0.0, 0.0]]  # the take's own start: the hand on the curve at its angle 0
return_tolerance = 0.02   # after a disturbance, the hand is back once within this of the curve (m)
after_window = 2.0        # the largest torque and off the curve are taken over this long after a disturbance's end (s)
ringing_cutoff_hz = 1.5   # after a disturbance, the hand's motion above this is its ringing (Hz)
ringing_window = 2.0      # the ringing is measured over this long after the disturbance's end (s)
following_window = 0.5    # the following gain: from a disturbance's onset to this long after its end (s)

[evaluation.extra_starts]
# hand_esn.toml's other seven starts on the curve (deg).
on_curve = [
  [47.3, 90.8], [62.6, 83.0], [75.1, 82.6], [79.0, 92.5], [71.5, 109.8], [53.3, 122.5], [36.2, 118.7],
]

# Report 007's pushes, 12.5 s apart, three loops and an eighth. Each: a force of `force`
# N for `duration` s from `onset` (task time, s), at `angle_deg` counterclockwise from
# the direction from the run's start hand toward the curve's center (0 toward it, 90
# across), fixed for the run.

[[disturbance]]  # nearly toward the center: 10 deg off it, counterclockwise
type = "push"
force = 3.0            # N; report 007's
onset = 8.0            # task time (s)
duration = 0.5         # s
angle_deg = 10.0       # deg from the direction toward the curve's center

[[disturbance]]  # nearly across, counterclockwise: 10 deg off it, toward the center
type = "push"
force = 5.0            # N; report 007's
onset = 20.5           # task time (s)
duration = 0.5         # s
angle_deg = 80.0       # deg from the direction toward the curve's center

[[disturbance]]  # nearly across, clockwise: 10 deg off it, toward the center
type = "push"
force = 4.0            # N; report 007's
onset = 33.0           # task time (s)
duration = 0.5         # s
angle_deg = -80.0      # deg from the direction toward the curve's center
