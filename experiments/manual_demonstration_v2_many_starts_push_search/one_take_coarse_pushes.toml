# The one-take baseline's coarse search's pushed runs: the 108 settings, one reservoir each
# (seed 0), trained on take 00 alone and run on the robot under report 007's three pushes
# at their forces, from its start. The undisturbed runs are the many-starts one-take coarse
# search's. one_take_coarse_score.toml scores each setting over both. About 2 minutes with
# 30 workers. See README.md.
#
#   uv run python experiments/sweep_robot_esn.py \
#       experiments/manual_demonstration_v2_many_starts_push_search/one_take_coarse_pushes.toml --workers 30

[demonstrations]
# Take 00 of reach_manual_v2_no_limits.toml's nine, filtered at 2 Hz: its hand starts in
# the direction of the start of reports 005 to 020's take.
run = "results/demonstrations/20261117-164658-reach_manual_v2_no_limits"
train = ["demo_00_filtered.sklog.npz"]  # from (13, 71) deg

[esn]
dt = 0.01              # sampling period (s)
warmup = 1.0           # the held start posture drives the ESN this long before it moves (s)
n_neurons = 800
spectral_radius = 1.2  # swept
sparsity = 0.05        # fraction of nonzero reservoir connections
leak_rate = 0.03       # swept
input_scaling = 0.5    # swept
bias = true
ridge = 1e-2           # swept
seed = 0

[sweep]
leak_rate = [0.01, 0.03, 0.1, 0.3]
spectral_radius = [0.9, 1.2, 1.5]
input_scaling = [0.1, 0.5, 2.0]
ridge = [1e-4, 1e-2, 1.0]

[tracker]
# The consistent search's tracker (report 017): joint PD at omega = 20 rad/s and a
# damping ratio of 0.4, given the reference's velocity, its torque computed every 10 ms
# and held between. Its gains are set where the take of reports 005 to 020 ends,
# whatever takes the ESN was trained on, so that every ESN is tracked alike.
laws = ["pd"]
omegas = [20.0]
dampings = [0.4]
acceleration_filter = 0.02  # time constant of the low-pass filter on the reference acceleration (s)
reference_velocity = true
control_period = 0.01  # the torque is computed this often and held between (s); the simulation step is 2 ms
gains_from = "results/demonstrations/20261008-170034-reach_manual_v2/demo_00_filtered.sklog.npz"

[evaluation]
duration = 24.0        # task (s), after the warm-up; the last push comes at 15 s
hold = 2.0             # hold window after arrival (s): the hand must stay within the target tolerance
start_offsets_deg = [[0.0, 0.0]]  # the take's own start
return_tolerance = 0.005  # after a disturbance, the hand is back once within this of the taught path (m)
ringing_cutoff_hz = 1.5   # after a disturbance, the hand's motion above this is its ringing (Hz)
ringing_window = 2.0      # the ringing is measured over this long after the disturbance's end (s)
following_window = 0.5    # the following gain: from a disturbance's onset to this long after its end (s)

# Each push: a force of `force` N for `duration` s, at `angle_deg` counterclockwise from
# the direction toward the target (0 forward, 90 across, 180 backward), fixed for the
# run by the start posture; from `way` of the way along the take, or from `onset` (s).

[[disturbance]]  # nearly forward: 10 deg off it, toward counterclockwise across
type = "push"
force = 3.0            # N; report 007's
way = 0.18             # the take's hand is 18% of the way to the target
duration = 0.5         # s
angle_deg = 10.0       # deg from the direction toward the target

[[disturbance]]  # nearly across, counterclockwise: 10 deg off it, toward the target
type = "push"
force = 5.0            # N; report 007's
way = 0.62             # 62% of the way
duration = 0.5         # s
angle_deg = 80.0       # deg from the direction toward the target

[[disturbance]]  # nearly across, clockwise, after the hold: 10 deg off it, toward the target
type = "push"
force = 4.0            # N; report 007's
onset = 15.0           # task time (s)
duration = 0.5         # s
angle_deg = -80.0      # deg from the direction toward the target
