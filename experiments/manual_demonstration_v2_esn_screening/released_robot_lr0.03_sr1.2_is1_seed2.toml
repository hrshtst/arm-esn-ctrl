# Screening ESNs without the robot, step 3, shown: ESN #2 (leak rate 0.03, spectral radius 1.2, input scaling 1, seed 2)
# against the replay of the take on the robot, the arm at rest at ESN #2's unstable fixed
# point beside the take's path, (39.85, 97.12) deg, the ESN held there 4 s, then let go:
# one of step 3's releases, for ESN #1 from the same posture.
#
#   uv run python experiments/robot_esn.py experiments/manual_demonstration_v2_esn_screening/released_robot_lr0.03_sr1.2_is1_seed2.toml

[esn]
model = "results/manual_demonstration_v2_robot_following_search/20261014-155052-grid_lr0.03_sr1.2_is1_seed2_filtered/esn.toml"

[tracker]
# Joint PD at omega = 20 rad/s and the damping ratio 0.4, given the reference's
# velocity, its torque computed every 10 ms, as in report 011's sweeps.
laws = ["pd"]
omegas = [20.0]
dampings = [0.4]
acceleration_filter = 0.02  # time constant of the low-pass filter on the reference acceleration (s)
reference_velocity = true
control_period = 0.01  # the torque is computed this often and held between (s); the simulation step is 2 ms

[evaluation]
duration = 30.0        # task (s), after the warm-up
hold = 2.0             # hold window after arrival (s): the hand must stay within the target tolerance
warmup = 4.0           # the start posture held this long before the task (s), as step 3's releases
# ESN #2's unstable fixed point, (39.847876, 97.119086) deg, less the demonstrated start, (29.999612, 30.001280) deg.
start_offsets_deg = [[9.848263656080231, 67.11780574801105]]
return_tolerance = 0.005  # after a disturbance, the hand is back once within this of the taught path (m)
ringing_cutoff_hz = 1.5   # after a disturbance, the hand's motion above this is its ringing (Hz)
ringing_window = 2.0      # the ringing is measured over this long after the disturbance's end (s)
following_window = 0.5    # the following gain: from a disturbance's onset to this long after its end (s)
