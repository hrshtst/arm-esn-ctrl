[esn]
# The best setting of untaught_search.toml and its typical seed.
dt = 0.01              # sampling period (s)
warmup = 1.0           # the held start posture drives the ESN this long before it moves (s)
n_neurons = 800
spectral_radius = 1.05
sparsity = 0.05        # fraction of nonzero reservoir connections
leak_rate = 0.17
input_scaling = 1.0
bias = true
ridge = 10.0
seed = 1
# The context, one value per target after the joint angles, is fed in divided by the
# input scaling, so that its input weights have the scale 1 whatever the input scaling
# is. Not swept.
context_scaling = 1.0
context_times_input_scaling = false

[evaluation]
duration = 24.0        # autonomous run (s)
hold = 2.0             # hold window after arrival (s): the hand must stay within the target tolerance
start_offsets_deg = [[0.0, 0.0]]  # each take's own start

[evaluation.extra_starts]
# Stage 1's untaught start postures (deg), those of its untaught_search.toml: 36 hand
# positions spread evenly over the workspace, joint 2 positive (tools/tip_starts.py
# <takes> --counts 18 12 6 --first-angle 53.3). None is nearer than 0.085 m to a
# target. Each is run with each of the three contexts.
untaught = [
  [27.0, 60.0], [47.0, 60.0], [67.0, 60.0], [87.0, 60.0], [107.0, 60.0], [127.0, 60.0],
  [147.0, 60.0], [167.0, 60.0], [-173.0, 60.0], [-153.0, 60.0], [-133.0, 60.0], [-113.0, 60.0],
  [-93.0, 60.0], [-73.0, 60.0], [-53.0, 60.0], [-33.0, 60.0], [-13.0, 60.0], [7.0, 60.0],
  [17.0, 109.0], [47.0, 109.0], [77.0, 109.0], [107.0, 109.0], [137.0, 109.0], [167.0, 109.0],
  [-163.0, 109.0], [-133.0, 109.0], [-103.0, 109.0], [-73.0, 109.0], [-43.0, 109.0], [-13.0, 109.0],
  [25.0, 146.0], [85.0, 146.0], [145.0, 146.0], [-155.0, 146.0], [-95.0, 146.0], [-35.0, 146.0],
]

[apps]
# The robot app's arguments, for the command the run prints: the consistent search's
# tracker, its gains set where the take of reports 005 to 020 ends (a copy in report
# 005), whatever takes the ESN was trained on.
robot_app = "--law pd --omega 20 --damping 0.4 --control-period 0.01 --gains-from reports/005-tuned-on-the-robot/data/20261008-170034-reach_manual_v2/demo_00_filtered.sklog.npz"
