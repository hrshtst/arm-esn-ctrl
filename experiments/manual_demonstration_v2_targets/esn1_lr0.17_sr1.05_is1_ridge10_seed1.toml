# ESN #1 of the search of three targets by context: the typical seed of the best
# setting when the fine search's 20 best settings are scored again with stage 1's
# untaught start postures (untaught_search.toml). Trained on the 27 takes of
# reach_manual_v2_targets.toml, nine to each target, each with its target's context.
# The run runs it on its own from each take's start with the context of that take's
# target, and from the 36 untaught start postures with each of the three contexts. It
# saves esn.toml and prints the apps' commands. See README.md.
#
#   uv run python experiments/autonomous_esn.py experiments/manual_demonstration_v2_targets/esn1_lr0.17_sr1.05_is1_ridge10_seed1.toml

[[demonstrations]]
# The nine takes to target A of reach_manual_v2_targets.toml, filtered at 2 Hz.
context = "A"
run = "results/demonstrations/20261118-175915-reach_manual_v2_targets_a"
train = [
  "demo_00_filtered.sklog.npz",  # take_001.sklog.npz, from (13, 71) deg
  "demo_01_filtered.sklog.npz",  # take_002.sklog.npz, from (-19, 86)
  "demo_02_filtered.sklog.npz",  # take_003.sklog.npz, from (-60, 121)
