# The coarse search: 108 settings of the leak rate, the spectral radius, the input
# scaling, and the ridge, one reservoir each (seed 0). Each ESN is trained on the 27
# takes of the three targets and run on the robot, undisturbed, from each take's start
# with the context of that take's target: 27 runs an ESN. Each setting is scored by how
# many of its runs arrive and hold at the target their context names, then by their
# median detour ratio; the best is the center of the fine search. About 35 minutes with
# 15 workers. See README.md.
#
#   uv run python experiments/sweep_robot_esn.py \
#       experiments/manual_demonstration_v2_targets/coarse_search.toml --workers 15

