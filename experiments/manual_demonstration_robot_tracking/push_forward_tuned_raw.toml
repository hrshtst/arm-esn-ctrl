# Stage 2 with a demonstration taught by hand: a 5 N push at the tip for 0.1 s at
# 4.32 s, along the reach toward the target.
#
#   uv run python experiments/robot_esn.py experiments/manual_demonstration_robot_tracking/push_forward_tuned_raw.toml
#
# The ESN has the settings report 003's sweeps found best for its scripted
# demonstration: ridge 10, leak rate 0.2, input scaling 3, 400 neurons, spectral
# radius 0.3, warm-up 1 s (grid_tuned_settings_raw.toml of manual-demonstration
# autonomous reaching), trained on the take as recorded, which the replay replays.
# push_forward_tuned_filtered.toml runs the ESN trained on the filtered take in the
# same scenario.
#
# Report 003 struck its scripted reach at 0.3 s (the block) and 0.4 s (the pushes),
# when the hand was 3.4 % and 9.9 % of the way to the target. This take's hand is
# that far at 4.10 s and 4.32 s, so the disturbances keep their force and length and
# start there.

[esn]
# A trained ESN: esn.toml in a run directory of experiments/autonomous_esn.py,
# relative to the storage root. The demonstration it was trained on (that run's
# [demonstrations]) is the one the time-indexed baseline replays.
model = "results/manual_demonstration_autonomous_reaching/20261006-153325-grid_tuned_settings_raw/esn.toml"

[tracker]
# Tracking laws: "computed_torque" (cancels the arm's dynamics) or "pd" (joint PD).
laws = ["computed_torque", "pd"]
# Natural frequency of the tracking error (rad/s), critically damped. Computed
# torque: kp = omega^2, kd = 2 omega. Joint PD: the same, scaled by each joint's
# inertia at the posture where the reach ends.
omegas = [10.0]
acceleration_filter = 0.02  # time constant of the low-pass filter on the reference acceleration (s)

[evaluation]
duration = 16.0        # task (s), after the warm-up; the demonstration lasts 14.8 s
hold = 2.0             # hold window after arrival (s): the hand must stay within the target tolerance
start_offsets_deg = [[0.0, 0.0]]  # the demonstrated start
effort_window = [4.32, 5.32]  # torque, effort, and force are measured from the push for 1 s (s)

[disturbance]
type = "push"
force = 5.0            # N
onset = 4.32           # task time when the push starts (s)
duration = 0.1         # s
direction = "forward"  # along the reach (start hand position to target), toward the target
