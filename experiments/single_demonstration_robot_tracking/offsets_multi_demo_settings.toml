# Stage 2 with one demonstration: no disturbance, from the grid of start postures of
# single-demonstration autonomous reaching: the demonstrated start offset by -15 to 15
# deg in each joint.
#
#   uv run python experiments/robot_esn.py experiments/single_demonstration_robot_tracking/offsets_multi_demo_settings.toml
#
# The ESN is the single-demonstration ESN with the settings found best for eight
# demonstrations (grid_multi_demo_settings.toml of single-demonstration autonomous
# reaching): ridge 1e-6, leak rate 0.05, input scaling 0.1, 600 neurons, spectral
# radius 1.3, warm-up 0.25 s. It keeps time like a clock running from the reset.
# offsets_tuned.toml runs the other ESN in the same scenario.

[esn]
# A trained ESN: esn.toml in a run directory of experiments/autonomous_esn.py,
# relative to the storage root. The demonstration it was trained on (that run's
# [demonstrations]) is the one the time-indexed baseline replays.
model = "results/single_demonstration_autonomous_reaching/20261005-190405-grid_multi_demo_settings/esn.toml"

[tracker]
# Tracking laws: "computed_torque" (cancels the arm's dynamics) or "pd" (joint PD).
laws = ["computed_torque", "pd"]
# Natural frequency of the tracking error (rad/s), critically damped. Computed
# torque: kp = omega^2, kd = 2 omega. Joint PD: the same, scaled by each joint's
# inertia at the posture where the reach ends.
omegas = [10.0]
acceleration_filter = 0.02  # time constant of the low-pass filter on the reference acceleration (s)

[evaluation]
duration = 5.0         # task (s), after the warm-up
hold = 2.0             # hold window after arrival (s): the hand must stay within the target tolerance
start_offsets_deg = [[0.0, 0.0]]  # the demonstrated start first; then the grid below
[evaluation.start_grid]
span_deg = 15.0        # offsets from -15 to 15 deg, in every combination (169 start postures)
step_deg = 2.5
