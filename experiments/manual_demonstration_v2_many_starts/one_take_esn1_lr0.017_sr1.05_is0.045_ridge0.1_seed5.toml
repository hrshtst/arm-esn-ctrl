# One-take ESN #1, the baseline of the many-starts analysis: the typical seed of the
# best setting when the one-take fine search's settings are scored again with the
# start postures no take starts from (one_take_untaught_search.toml). Trained on take 00
# alone, and run on its own from its start and from those 36 start postures. The run
# saves esn.toml and prints the apps' commands. See README.md.
#
#   uv run python experiments/autonomous_esn.py experiments/manual_demonstration_v2_many_starts/one_take_esn1_lr0.017_sr1.05_is0.045_ridge0.1_seed5.toml

[demonstrations]
# Take 00 of reach_manual_v2_no_limits.toml's nine, filtered at 2 Hz: its hand starts in
# the direction of the start of reports 005 to 020's take.
run = "results/demonstrations/20261117-164658-reach_manual_v2_no_limits"
train = ["demo_00_filtered.sklog.npz"]  # from (13, 71) deg

[esn]
# The best setting of one_take_untaught_search.toml and its typical seed.
dt = 0.01              # sampling period (s)
warmup = 1.0           # the held start posture drives the ESN this long before it moves (s)
n_neurons = 800
spectral_radius = 1.05
sparsity = 0.05        # fraction of nonzero reservoir connections
leak_rate = 0.017
input_scaling = 0.045
bias = true
ridge = 0.1
seed = 5

[evaluation]
duration = 24.0        # autonomous run (s)
hold = 2.0             # hold window after arrival (s): the hand must stay within the target tolerance
start_offsets_deg = [[0.0, 0.0]]  # the take's own start

[evaluation.extra_starts]
# Start postures no take starts from (deg), laid out by the hand: 36 hand positions
# spread evenly over the workspace, on three rings around the base, 0.78, 0.53, and
# 0.28 m from it, with 18, 12, and 6 hands, each standing for the same area, and
# joint 2 positive, as in the takes. They are turned 10 deg from the takes' rings, so
# that no hand is nearer than 0.10 m to a take's start:
#
#   uv run python tools/tip_starts.py experiments/demonstrations/reach_manual_v2_no_limits.toml \
#       --counts 18 12 6 --first-angle 53.3
untaught = [
  [27.0, 60.0], [47.0, 60.0], [67.0, 60.0], [87.0, 60.0], [107.0, 60.0], [127.0, 60.0],
  [147.0, 60.0], [167.0, 60.0], [-173.0, 60.0], [-153.0, 60.0], [-133.0, 60.0], [-113.0, 60.0],
  [-93.0, 60.0], [-73.0, 60.0], [-53.0, 60.0], [-33.0, 60.0], [-13.0, 60.0], [7.0, 60.0],
  [17.0, 109.0], [47.0, 109.0], [77.0, 109.0], [107.0, 109.0], [137.0, 109.0], [167.0, 109.0],
  [-163.0, 109.0], [-133.0, 109.0], [-103.0, 109.0], [-73.0, 109.0], [-43.0, 109.0], [-13.0, 109.0],
  [25.0, 146.0], [85.0, 146.0], [145.0, 146.0], [-155.0, 146.0], [-95.0, 146.0], [-35.0, 146.0],
]

[apps]
# The robot app's arguments, for the command the run prints: the consistent search's
# tracker, its gains set where the take of reports 005 to 020 ends (a copy in report
# 005), whatever takes the ESN was trained on.
robot_app = "--law pd --omega 20 --damping 0.4 --control-period 0.01 --gains-from reports/005-tuned-on-the-robot/data/20261008-170034-reach_manual_v2/demo_00_filtered.sklog.npz"
