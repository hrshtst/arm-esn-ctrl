# The fine search's 20 settings that hold in all 45 runs from the takes' starts, scored
# again with the start postures no take starts from: each with its five reservoirs
# (seeds 1 to 5), on the robot, undisturbed, from each take's start and from
# hand_esn.toml's 36 untaught ones. Each setting is scored over its 225 runs by how many
# arrive and hold, then by their median detour ratio; ESN #1 and ESN #2 are the typical
# seeds of the two best. About 30 minutes with 30 workers.
# See README.md.
#
#   uv run python experiments/sweep_robot_esn.py \
#       experiments/manual_demonstration_v2_many_starts/untaught_search.toml --workers 30

# The fine search's settings whose 45 runs all hold, in its order, each with the median
# detour ratio it had there.
settings = [
  { leak_rate = 0.1, spectral_radius = 1.2, input_scaling = 1.0, ridge = 1.0 },  # 1.0068
  { leak_rate = 0.055, spectral_radius = 1.2, input_scaling = 1.0, ridge = 0.1 },  # 1.0082
  { leak_rate = 0.055, spectral_radius = 1.35, input_scaling = 1.0, ridge = 1.0 },  # 1.0084
  { leak_rate = 0.055, spectral_radius = 1.2, input_scaling = 1.0, ridge = 1.0 },  # 1.0086
  { leak_rate = 0.1, spectral_radius = 1.35, input_scaling = 1.0, ridge = 0.1 },  # 1.0092
  { leak_rate = 0.17, spectral_radius = 1.2, input_scaling = 1.0, ridge = 1.0 },  # 1.0099
  { leak_rate = 0.055, spectral_radius = 1.05, input_scaling = 1.0, ridge = 1.0 },  # 1.0106
  { leak_rate = 0.17, spectral_radius = 1.35, input_scaling = 1.0, ridge = 1.0 },  # 1.0108
