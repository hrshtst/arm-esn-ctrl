# The fine search: 81 settings around the coarse search's best (leak rate 0.1, spectral
# radius 1.2, input scaling 0.5, ridge 1), five reservoirs each (seeds 1 to 5), trained
# on the nine takes and run on the robot, undisturbed, from each take's start. Each
# setting is scored over the 45 runs of its five seeds by how many arrive and hold, then
# by their median detour ratio; ESN #1 and ESN #2 are the typical seeds of the two best.
# About 25 minutes with 30 workers. See README.md.
#
#   uv run python experiments/sweep_robot_esn.py \
#       experiments/manual_demonstration_v2_many_starts/fine_search.toml --workers 30

[demonstrations]
# The nine takes of reach_manual_v2_no_limits.toml, filtered at 2 Hz.
run = "results/demonstrations/20261117-164658-reach_manual_v2_no_limits"
train = [
  "demo_00_filtered.sklog.npz",  # from (13, 71) deg
  "demo_01_filtered.sklog.npz",  # from (73, 71)
  "demo_02_filtered.sklog.npz",  # from (133, 71)
  "demo_03_filtered.sklog.npz",  # from (-167, 71)
  "demo_04_filtered.sklog.npz",  # from (-107, 71)
  "demo_05_filtered.sklog.npz",  # from (-47, 71)
  "demo_06_filtered.sklog.npz",  # from (21, 132)
  "demo_07_filtered.sklog.npz",  # from (141, 132)
  "demo_08_filtered.sklog.npz",  # from (-99, 132)
]

[esn]
dt = 0.01              # sampling period (s)
warmup = 1.0           # the held start posture drives the ESN this long before it moves (s)
n_neurons = 800
spectral_radius = 1.2  # swept; the center's
sparsity = 0.05        # fraction of nonzero reservoir connections
leak_rate = 0.1        # swept; the center's
input_scaling = 0.5    # swept; the center's
bias = true
ridge = 1.0            # swept; the center's
seed = 1               # swept

[sweep]
# The center's value, and the one halfway to its coarse neighbor on each side: in ratio
# for the leak rate (0.03 and 0.3), the input scaling (0.1 and 2), and the ridge, in
# difference for the spectral radius (0.9 and 1.5). The center's ridge is the coarse
# grid's largest, so the value beyond it is as far from the center as the one below.
leak_rate = [0.055, 0.1, 0.17]
spectral_radius = [1.05, 1.2, 1.35]
input_scaling = [0.22, 0.5, 1.0]
ridge = [0.1, 1.0, 10.0]
seed = [1, 2, 3, 4, 5]

[ranking]
# The most runs that arrive and hold, then the smallest median detour ratio of the
# runs that arrive.
by = "detour_ratio"

[tracker]
# The consistent search's tracker (report 017): joint PD at omega = 20 rad/s and a
# damping ratio of 0.4, given the reference's velocity, its torque computed every 10 ms
# and held between. Its gains are set where the take of reports 005 to 020 ends,
# whatever takes the ESN was trained on, so that every ESN is tracked alike.
laws = ["pd"]
omegas = [20.0]
dampings = [0.4]
acceleration_filter = 0.02  # time constant of the low-pass filter on the reference acceleration (s)
reference_velocity = true
control_period = 0.01  # the torque is computed this often and held between (s); the simulation step is 2 ms
gains_from = "results/demonstrations/20261008-170034-reach_manual_v2/demo_00_filtered.sklog.npz"

[evaluation]
duration = 24.0        # task (s), after the warm-up
hold = 2.0             # hold window after arrival (s): the hand must stay within the target tolerance
start_offsets_deg = [[0.0, 0.0]]  # each take's own start
