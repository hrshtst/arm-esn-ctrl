# BASE: copy this file to a new name, such as states_<settings>_raw.toml, and edit
# the copy. Lines marked EDIT are the ones to set.
#
# Stage 1 on the remade arm (v2): the reservoir states of a trained ESN, compared by
# principal components. The states while the take is fed in (teacher forcing) give
# the principal components; the autonomous runs from a grid of start postures are
# projected onto them and compared with the take's states over time.
#
#   uv run python experiments/reservoir_states.py experiments/manual_demonstration_v2_autonomous_reaching/<copy>.toml

[esn]
# The trained ESN: esn.toml of a run of experiments/autonomous_esn.py, relative to
# the storage root. Its run directory names the demonstration it was trained on.
model = "results/manual_demonstration_v2_autonomous_reaching/YYYYMMDD-HHMMSS-grid_<settings>_raw/esn.toml"  # EDIT

[evaluation]
duration = 18.4        # EDIT: autonomous run (s): within the take's 18.5 s, so every state has one to compare with
[evaluation.start_grid]
span_deg = 15.0        # EDIT: the start offsets of the grid run: -span to span deg in each joint
step_deg = 2.5         # EDIT

[states]
n_components = 10      # principal components each state is projected onto (projections.npz)
join_threshold = 0.1   # a run joins the demonstration's states once the time-matched distance stays below this
phase_window = [1.15, 9.64]  # EDIT: the take's reach (s), from 3.4 % of the way to the target to arriving: the phase lead's span
# The start offsets (deg) whose runs pca.png and convergence.png draw: the outer ring of the grid.
shown_offsets_deg = [
  [15.0, 0.0], [-15.0, 0.0], [0.0, 15.0], [0.0, -15.0],
  [15.0, 15.0], [15.0, -15.0], [-15.0, 15.0], [-15.0, -15.0],
]  # EDIT: if span_deg changes
