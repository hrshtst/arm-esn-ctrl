# Stage 1: an ESN trained on a single demonstration, run autonomously.
#
#   uv run python experiments/autonomous_esn.py configs/esn/autonomous_tvs_demo07.toml
#
# The ESN learns one time-varying-stiffness demonstration (demo 7: the hand
# reaches from (0.35, 0.85) m to the target at (0, 1.2) m). It then runs from
# the same start posture and from slightly disturbed ones, and each run is
# compared with the demonstrator's own reach from the same posture.

[demonstrations]
# A run directory of experiments/make_demonstrations.py, relative to the storage root.
run = "results/20260930-175440-reach_tvs"
train = "demo_07.sklog.npz"

[esn]
dt = 0.01              # sampling period (s)
warmup = 1.0           # the held start posture drives the ESN this long before it moves (s)
n_neurons = 300
spectral_radius = 0.5
sparsity = 0.1         # fraction of nonzero reservoir connections
leak_rate = 0.3
input_scaling = 1.0
bias = true
ridge = 1.0            # strong regularization keeps the autonomous ESN stable
seed = 0

[evaluation]
duration = 3.0         # autonomous run (s); the demonstration lasts 2 s
# Start postures: the demonstration's start plus these offsets (deg).
start_offsets_deg = [
  [0.0, 0.0],
  [3.0, 0.0],
  [-3.0, 0.0],
  [0.0, 3.0],
  [0.0, -3.0],
]
