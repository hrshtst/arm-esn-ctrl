# Stage 1: sweep ridge, leak rate, and input scaling of the ESN trained on all
# eight demonstrations.
#
#   uv run python experiments/sweep_esn.py configs/esn/sweep_tvs_all.toml
#
# Everything except [sweep] is autonomous_tvs_all.toml. Every combination of the
# [sweep] values replaces the matching [esn] values, is trained on the eight
# time-varying-stiffness demonstrations, and runs from their start postures and
# from the eight new ones between them.

[demonstrations]
# A run directory of experiments/make_demonstrations.py, relative to the storage root.
run = "results/20261002-194644-reach_tvs"
train = [
  "demo_00.sklog.npz",
  "demo_01.sklog.npz",
  "demo_02.sklog.npz",
  "demo_03.sklog.npz",
  "demo_04.sklog.npz",
  "demo_05.sklog.npz",
  "demo_06.sklog.npz",
  "demo_07.sklog.npz",
]

[esn]
dt = 0.01              # sampling period (s)
warmup = 1.0           # the held start posture drives the ESN this long before it moves (s)
n_neurons = 300
spectral_radius = 0.5
sparsity = 0.1         # fraction of nonzero reservoir connections
leak_rate = 0.3        # swept
input_scaling = 1.0    # swept
bias = true
ridge = 1.0            # swept
seed = 0

[sweep]
# The first two are the heatmap axes; each value of the third gets its own column.
ridge = [1e-6, 1e-4, 1e-2, 1e-1, 1.0, 10.0]
leak_rate = [0.05, 0.1, 0.2, 0.3, 0.5, 1.0]
input_scaling = [0.1, 0.3, 0.6, 1.0, 1.2, 1.5]

[evaluation]
duration = 5.0         # autonomous run (s); the demonstrations last 4 s
hold = 2.0             # hold window after arrival (s): the hand must stay within the target tolerance
# Start postures: each demonstration's start plus these offsets (deg).
start_offsets_deg = [[0.0, 0.0]]
# Start postures no demonstration starts from (joint angles in degrees): 0.5 m
# from the target, halfway between the demonstrated directions.
extra_start_q_deg = [
  [40.5, 71.4],   # hand ( 0.46, 1.39) m,  22.5 deg
  [64.2, 43.6],   # hand ( 0.19, 1.66) m,  67.5 deg
  [77.3, 43.6],   # hand (-0.19, 1.66) m, 112.5 deg
  [77.2, 71.4],   # hand (-0.46, 1.39) m, 157.5 deg
  [70.4, 104.8],  # hand (-0.46, 1.01) m, 202.5 deg
  [52.7, 131.4],  # hand (-0.19, 0.74) m, 247.5 deg
  [23.6, 131.4],  # hand ( 0.19, 0.74) m, 292.5 deg
  [21.2, 104.8],  # hand ( 0.46, 1.01) m, 337.5 deg
]
