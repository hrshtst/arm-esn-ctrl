# The scripted fine search's 20 best settings, of its 69 that cycle in all 40 runs from
# the starts on the curve, scored again with the start postures no take starts from:
# each with its five reservoirs (seeds 1 to 5), on the robot, undisturbed, from the
# eight starts on the curve and from stage 1's 36 untaught starts, 44 runs an ESN and
# 220 a setting, for 40 s each. Each setting is scored over its 220 runs by how many
# cycle, then by the median curve RMS of the runs that cycle; ESN #1 and ESN #2 of the
# scripted take are the typical seeds of the two best. Sweeps here take 15 workers, not
# 30: the machine is shared. About 90 minutes with 15 workers: 4,400 runs, where the
# fine search's 3,240 took 68 minutes while another sweep shared the machine. See
# README.md.
#
#   uv run python experiments/sweep_robot_esn.py \
#       experiments/manual_demonstration_v2_periodic/scripted_untaught_search.toml --workers 15

# The scripted fine search's 20 best settings (run 20261118-194306-scripted_fine_search),
# in its order, each with the median curve RMS it had there (mm); all 20 cycle in all 40
# runs.
settings = [
  { leak_rate = 0.017, spectral_radius = 1.35, input_scaling = 4.0, ridge = 1e-3 },  # 0.786
  { leak_rate = 0.017, spectral_radius = 1.5, input_scaling = 4.0, ridge = 1e-3 },  # 0.786
