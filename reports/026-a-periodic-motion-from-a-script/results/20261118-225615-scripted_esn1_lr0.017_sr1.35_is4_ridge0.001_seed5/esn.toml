# A trained ESN of arm_esn_ctrl; load it with arm_esn_ctrl.esn.ReachingEsn.load(<this file>).
model = "esn.rclib"

[esn]
dt = 0.01
warmup = 1.0
n_neurons = 800
spectral_radius = 1.35
sparsity = 0.05
leak_rate = 0.017
input_scaling = 4.0
bias = true
ridge = 0.001
seed = 5
teacher_noise_deg = 0.0
teacher_copies = 1
teacher_noise_exponent = 0.0
bias_scaling = 1.0
context_scaling = 1.0

[normalization]
center_rad = [
    0.9857099034817975,
    1.7883556825275262,
]
half_range_rad = [
    0.3946644553616063,
    0.36309523514266784,
]
