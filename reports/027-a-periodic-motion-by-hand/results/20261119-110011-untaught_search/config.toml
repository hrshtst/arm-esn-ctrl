# The fine search's 20 best settings on the take by hand, of its 31 that cycle in all 40
# runs from the starts on the curve, scored again with the start postures no take starts
# from: each with its five reservoirs (seeds 1 to 5), on the robot, undisturbed, from the
# eight starts on the curve and from stage 1's 36 untaught starts, 44 runs an ESN and
# 220 a setting, for 40 s each. Each setting is scored over its 220 runs by how many
# cycle, then by the median curve RMS of the runs that cycle; ESN #1 and ESN #2 of the
# take by hand are the typical seeds of the two best. It is scripted_untaught_search.toml
# but for the take and the settings. Sweeps here take 15 workers, not 30: the machine is
# shared. About 80 minutes with 15 workers: 100 ESNs with 44 runs each, where the fine
# search's 405 with 8 runs each took 50 minutes. See README.md.
#
#   uv run python experiments/sweep_robot_esn.py \
#       experiments/manual_demonstration_v2_periodic/untaught_search.toml --workers 15

# The fine search's 20 best settings (run 20261119-100337-fine_search), in its order,
# each with the median curve RMS it had there (mm); all 20 cycle in all 40 runs.
settings = [
  { leak_rate = 0.055, spectral_radius = 0.9, input_scaling = 0.5, ridge = 1.0 },  # 4.34
  { leak_rate = 0.055, spectral_radius = 1.05, input_scaling = 0.5, ridge = 10.0 },  # 5.12
  { leak_rate = 0.055, spectral_radius = 0.75, input_scaling = 0.5, ridge = 1.0 },  # 5.21
  { leak_rate = 0.055, spectral_radius = 1.05, input_scaling = 0.5, ridge = 1.0 },  # 5.52
  { leak_rate = 0.03, spectral_radius = 0.9, input_scaling = 0.5, ridge = 1.0 },  # 5.53
  { leak_rate = 0.03, spectral_radius = 0.9, input_scaling = 0.22, ridge = 1.0 },  # 5.62
  { leak_rate = 0.055, spectral_radius = 0.9, input_scaling = 0.5, ridge = 10.0 },  # 5.66
  { leak_rate = 0.055, spectral_radius = 0.75, input_scaling = 0.5, ridge = 10.0 },  # 5.82
  { leak_rate = 0.03, spectral_radius = 0.75, input_scaling = 0.5, ridge = 1.0 },  # 6.01
  { leak_rate = 0.055, spectral_radius = 0.75, input_scaling = 0.22, ridge = 10.0 },  # 6.07
  { leak_rate = 0.03, spectral_radius = 0.75, input_scaling = 0.5, ridge = 10.0 },  # 6.23
  { leak_rate = 0.055, spectral_radius = 0.75, input_scaling = 1.0, ridge = 10.0 },  # 6.40
  { leak_rate = 0.055, spectral_radius = 1.05, input_scaling = 1.0, ridge = 10.0 },  # 6.44
  { leak_rate = 0.03, spectral_radius = 0.9, input_scaling = 0.5, ridge = 10.0 },  # 6.52
  { leak_rate = 0.055, spectral_radius = 0.9, input_scaling = 1.0, ridge = 1.0 },  # 6.58
  { leak_rate = 0.055, spectral_radius = 0.75, input_scaling = 1.0, ridge = 1.0 },  # 6.62
  { leak_rate = 0.017, spectral_radius = 1.05, input_scaling = 1.0, ridge = 10.0 },  # 6.63
  { leak_rate = 0.03, spectral_radius = 1.05, input_scaling = 0.5, ridge = 10.0 },  # 6.72
  { leak_rate = 0.055, spectral_radius = 0.9, input_scaling = 1.0, ridge = 10.0 },  # 6.74
  { leak_rate = 0.03, spectral_radius = 0.75, input_scaling = 0.22, ridge = 1.0 },  # 6.76
]

[demonstrations]
# The run directory of experiments/import_demonstrations.py for
# ellipse_manual_v2_no_limits.toml, relative to the storage root, and its take
# filtered at 2 Hz.
run = "results/demonstrations/20261119-093746-ellipse_manual_v2_no_limits"
train = ["demo_00_filtered.sklog.npz"]

[esn]
dt = 0.01              # sampling period (s)
warmup = 1.0           # the held start posture drives the ESN this long before it moves (s)
n_neurons = 800
spectral_radius = 0.9  # listed in [[settings]]
sparsity = 0.05        # fraction of nonzero reservoir connections
leak_rate = 0.03       # listed in [[settings]]
input_scaling = 0.5    # listed in [[settings]]
bias = true
ridge = 1.0            # listed in [[settings]]
seed = 1               # swept

[sweep]
seed = [1, 2, 3, 4, 5]

[ranking]
# The most runs that cycle, then the smallest median curve RMS of the runs that cycle.
by = "curve_rms_m"

[tracker]
# The consistent search's tracker (report 017): joint PD at omega = 20 rad/s and a
# damping ratio of 0.4, given the reference's velocity, its torque computed every 10 ms
# and held between. Its gains are set where the take of reports 005 to 020 ends,
# whatever takes the ESN was trained on, so that every ESN is tracked alike.
laws = ["pd"]
omegas = [20.0]
dampings = [0.4]
acceleration_filter = 0.02  # time constant of the low-pass filter on the reference acceleration (s)
reference_velocity = true
control_period = 0.01  # the torque is computed this often and held between (s); the simulation step is 2 ms
gains_from = "results/demonstrations/20261008-170034-reach_manual_v2/demo_00_filtered.sklog.npz"

[evaluation]
duration = 40.0           # task (s), after the warm-up: ten taught periods
# A run cycles if, over its last cycle_periods taught periods, the hand's angle about
# the curve's center grows by cycle_turns turns, five at the taught pace, and the RMS
# of its distance from the curve, the ellipse itself, is at most curve_tolerance,
# stage 1's goal radius.
curve_tolerance = 0.02    # m
cycle_periods = 5
cycle_turns = [4.0, 6.0]  # the least and the most
start_offsets_deg = [[0.0, 0.0]]  # the take's own start: the hand on the curve at its angle 0

[evaluation.extra_starts]
# The other seven starts on the curve (deg): the hand on the ellipse at the curve's
# angles 45, 90, ..., 315 deg, which the scripted take's grows at an even rate, an
# eighth of a loop apart; joint 2 positive, as at the take's start, rounded to 0.1 deg.
on_curve = [
  [47.3, 90.8], [62.6, 83.0], [75.1, 82.6], [79.0, 92.5], [71.5, 109.8], [53.3, 122.5], [36.2, 118.7],
]
