# The rule's guard: how much the replay rings with the search's tracker under the three
# pushes of 0.5 s at the tip, forward at 3 s, across at 7 s, and across again at 15 s,
# after the hold (report 007's), from the take's start. Its ESN, report 011's ESN #1,
# only runs beside it, since the replay does not depend on the ESN, and repeats its run
# with the same tracker in report 011 (see README.md, step 0).
#
#   uv run python experiments/robot_esn.py experiments/manual_demonstration_v2_consistent_search/guard_pushes_robot.toml

[esn]
# Report 011's ESN #1: leak rate 0.03, spectral radius 1.2, input scaling 1.5, seed 8.
model = "results/manual_demonstration_v2_robot_following_search/20261014-155052-grid_lr0.03_sr1.2_is1.5_seed8_filtered/esn.toml"

[tracker]
# The search's tracker: joint PD at omega = 20 rad/s and a damping ratio of 0.4, given
# the reference's velocity, its torque computed every 10 ms, the ESN's period, and
# held between.
laws = ["pd"]
omegas = [20.0]
dampings = [0.4]
acceleration_filter = 0.02  # time constant of the low-pass filter on the reference acceleration (s)
reference_velocity = true
control_period = 0.01  # the torque is computed this often and held between (s); the simulation step is 2 ms

[evaluation]
duration = 24.0        # task (s), after the warm-up; the take lasts 18.5 s, and the last push comes at 15 s
hold = 2.0             # hold window after arrival (s): the hand must stay within the target tolerance
start_offsets_deg = [[0.0, 0.0]]  # the take's start
return_tolerance = 0.005  # after a disturbance, the hand is back once within this of the taught path (m)
ringing_cutoff_hz = 1.5   # after a disturbance, the hand's motion above this is its ringing (Hz); the tracker rings at 2.9 Hz
ringing_window = 2.0      # the ringing is measured over this long after the disturbance's end (s)
following_window = 0.5    # the following gain: from a disturbance's onset to this long after its end (s)

# Report 007's pushes. Each: a force of `force` N for `duration` s from `onset` (task
# time, s), at `angle_deg` counterclockwise from the direction toward the target (0
# forward, 90 across, 180 backward), fixed for the run by the start posture.

[[disturbance]]  # nearly forward: 10 deg off it, toward counterclockwise across
type = "push"
force = 3.0            # N
onset = 3.0            # task time (s): the take's hand is 18% of the way
duration = 0.5         # s
angle_deg = 10.0       # deg from the direction toward the target

[[disturbance]]  # nearly across, counterclockwise: 10 deg off it, toward the target
type = "push"
force = 5.0            # N
onset = 7.0            # task time (s): 62% of the way, and done 2.1 s before the take arrives
duration = 0.5         # s
angle_deg = 80.0       # deg from the direction toward the target

[[disturbance]]  # nearly across, clockwise, after the hold: 10 deg off it, toward the target
type = "push"
force = 4.0            # N
onset = 15.0           # task time (s)
duration = 0.5         # s
angle_deg = -80.0      # deg from the direction toward the target
