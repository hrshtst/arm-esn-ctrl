# A trained ESN of arm_esn_ctrl; load it with arm_esn_ctrl.esn.ReachingEsn.load(<this file>).
model = "esn.rclib"

[esn]
dt = 0.01
warmup = 1.0
n_neurons = 400
spectral_radius = 1.2
sparsity = 0.05
leak_rate = 0.03
input_scaling = 1.5
bias = true
ridge = 0.01
seed = 8
teacher_noise_deg = 0.0
teacher_copies = 1
teacher_noise_exponent = 0.0

[normalization]
center_rad = [
    1.1832647306012716,
    1.2520552107239682,
]
half_range_rad = [
    0.8123445293324258,
    0.7284340912706315,
]
