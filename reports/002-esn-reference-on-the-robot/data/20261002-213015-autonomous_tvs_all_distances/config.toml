# Stage 1: the ESN trained on all eight demonstrations, run from start postures
# at other distances from the target.
#
#   uv run python experiments/autonomous_esn.py configs/esn/autonomous_tvs_all_distances.toml
#
# The demonstrations start 0.5 m from the target. Besides their starts and the
# starts halfway between them at the same distance, the ESN runs from starts
# 0.25 m and 0.75 m from the target, to test whether it generalizes to reaches
# of other lengths. The ESN uses the best combination of the two sweeps
# (sweep_tvs_all.toml, run 20261002-201614; sweep_tvs_all_reservoir.toml, run
# 20261002-202915): ridge 1e-6, leak rate 0.05, input scaling 0.1, 600 neurons,
# spectral radius 1.3, warm-up 0.25 s.

[demonstrations]
# A run directory of experiments/make_demonstrations.py, relative to the storage root.
run = "results/20261002-194644-reach_tvs"
train = [
  "demo_00.sklog.npz",
  "demo_01.sklog.npz",
  "demo_02.sklog.npz",
  "demo_03.sklog.npz",
  "demo_04.sklog.npz",
  "demo_05.sklog.npz",
  "demo_06.sklog.npz",
  "demo_07.sklog.npz",
]

[esn]
dt = 0.01              # sampling period (s)
warmup = 0.25          # the held start posture drives the ESN this long before it moves (s)
n_neurons = 600
spectral_radius = 1.3
sparsity = 0.1         # fraction of nonzero reservoir connections
leak_rate = 0.05
input_scaling = 0.1
bias = true
ridge = 1e-6
seed = 0

[evaluation]
duration = 5.0         # autonomous run (s); the demonstrations last 4 s
hold = 2.0             # hold window after arrival (s): the hand must stay within the target tolerance
# Start postures: each demonstration's start plus these offsets (deg).
start_offsets_deg = [[0.0, 0.0]]
# Start postures no demonstration starts from, by group (joint angles in degrees).
[evaluation.extra_starts]
# 0.5 m from the target, halfway between the demonstrated directions.
between = [
  [40.5, 71.4],   # hand ( 0.46, 1.39) m,  22.5 deg
  [64.2, 43.6],   # hand ( 0.19, 1.66) m,  67.5 deg
  [77.3, 43.6],   # hand (-0.19, 1.66) m, 112.5 deg
  [77.2, 71.4],   # hand (-0.46, 1.39) m, 157.5 deg
  [70.4, 104.8],  # hand (-0.46, 1.01) m, 202.5 deg
  [52.7, 131.4],  # hand (-0.19, 0.74) m, 247.5 deg
  [23.6, 131.4],  # hand ( 0.19, 0.74) m, 292.5 deg
  [21.2, 104.8],  # hand ( 0.46, 1.01) m, 337.5 deg
]
# 0.25 m from the target, in the demonstrated directions: shorter reaches, inside
# the ring of demonstrated starts.
nearer = [
  [37.7, 94.9],   # hand ( 0.25, 1.20) m,   0 deg
  [48.1, 79.7],   # hand ( 0.18, 1.38) m,  45 deg
  [58.1, 73.2],   # hand ( 0.00, 1.45) m,  90 deg
  [62.8, 79.7],   # hand (-0.18, 1.38) m, 135 deg
  [61.2, 94.9],   # hand (-0.25, 1.20) m, 180 deg
  [53.6, 110.6],  # hand (-0.18, 1.02) m, 225 deg
  [41.6, 117.4],  # hand ( 0.00, 0.95) m, 270 deg
  [34.0, 110.6],  # hand ( 0.18, 1.02) m, 315 deg
]
# 0.75 m from the target, in the demonstrated directions that stay well inside the
# workspace: longer reaches, outside the ring of demonstrated starts.
farther = [
  [24.6, 76.9],   # hand ( 0.75, 1.20) m,   0 deg
  [88.6, 76.9],   # hand (-0.75, 1.20) m, 180 deg
  [78.0, 124.7],  # hand (-0.53, 0.67) m, 225 deg
  [38.7, 154.0],  # hand ( 0.00, 0.45) m, 270 deg
  [1.3, 124.7],   # hand ( 0.53, 0.67) m, 315 deg
]
