# Stage 2 with a demonstration taught by hand, underdamped trackers: a 5 N push at
# the tip for 0.1 s at 4.32 s, along the reach away from the target.
#
#   uv run python experiments/robot_esn.py experiments/manual_demonstration_robot_tracking/push_backward_multi_demo_settings_damping_raw.toml
#
# The ESN has the settings found best for eight demonstrations: ridge 1e-6, leak
# rate 0.05, input scaling 0.1, 600 neurons, spectral radius 1.3, warm-up 0.25 s
# (grid_multi_demo_settings_raw.toml of manual-demonstration autonomous reaching),
# trained on the take as recorded, which the replay replays.
# push_backward_multi_demo_settings_damping_filtered.toml runs the ESN trained on
# the filtered take in the same scenario.
#
# Report 003 struck its scripted reach at 0.3 s (the block) and 0.4 s (the pushes),
# when the hand was 3.4 % and 9.9 % of the way to the target. This take's hand is
# that far at 4.10 s and 4.32 s, so the disturbances keep their force and length and
# start there.
#
# As push_backward_multi_demo_settings_raw.toml, with the tracker underdamped:
# computed torque at omega = 10 rad/s and joint PD at omega = 20 rad/s, each with
# the damping ratios 1, 0.5, 0.3, and 0.1.

[esn]
# A trained ESN: esn.toml in a run directory of experiments/autonomous_esn.py,
# relative to the storage root. The demonstration it was trained on (that run's
# [demonstrations]) is the one the time-indexed baseline replays.
model = "results/manual_demonstration_autonomous_reaching/20261006-153139-grid_multi_demo_settings_raw/esn.toml"

[tracker]
# Tracking laws: "computed_torque" (cancels the arm's dynamics) or "pd" (joint PD).
laws = ["computed_torque", "pd"]
# One natural frequency of the tracking error for each law (rad/s), and several
# damping ratios: 1 is critically damped, and smaller ratios make the error
# oscillate as it decays. Computed torque: kp = omega^2, kd = 2 zeta omega. Joint
# PD: the same, scaled by each joint's inertia at the posture where the reach ends.
omegas = { computed_torque = [10.0], pd = [20.0] }
dampings = [1.0, 0.5, 0.3, 0.1]
acceleration_filter = 0.02  # time constant of the low-pass filter on the reference acceleration (s)

[evaluation]
duration = 16.0        # task (s), after the warm-up; the demonstration lasts 14.8 s
hold = 2.0             # hold window after arrival (s): the hand must stay within the target tolerance
start_offsets_deg = [[0.0, 0.0]]  # the demonstrated start
effort_window = [4.32, 5.32]  # torque, effort, and force are measured from the push for 1 s (s)

[disturbance]
type = "push"
force = 5.0            # N
onset = 4.32           # task time when the push starts (s)
duration = 0.1         # s
direction = "backward" # along the reach (start hand position to target), away from the target
