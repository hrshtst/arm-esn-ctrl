# Stage 2 with a demonstration taught by hand, joint PD at higher gains: the tip
# held from 4.1 s to 4.6 s by a stiff spring-damper, then let go.
#
#   uv run python experiments/robot_esn.py experiments/manual_demonstration_robot_tracking/block_multi_demo_settings_pd_gains_raw.toml
#
# The ESN has the settings found best for eight demonstrations: ridge 1e-6, leak
# rate 0.05, input scaling 0.1, 600 neurons, spectral radius 1.3, warm-up 0.25 s
# (grid_multi_demo_settings_raw.toml of manual-demonstration autonomous reaching),
# trained on the take as recorded, which the replay replays.
# block_multi_demo_settings_pd_gains_filtered.toml runs the ESN trained on the
# filtered take in the same scenario.
#
# Report 003 struck its scripted reach at 0.3 s (the block) and 0.4 s (the pushes),
# when the hand was 3.4 % and 9.9 % of the way to the target. This take's hand is
# that far at 4.10 s and 4.32 s, so the disturbances keep their force and length and
# start there.
#
# As block_multi_demo_settings_raw.toml, with joint PD only, at omega = 10, 20, and
# 40 rad/s.

[esn]
# A trained ESN: esn.toml in a run directory of experiments/autonomous_esn.py,
# relative to the storage root. The demonstration it was trained on (that run's
# [demonstrations]) is the one the time-indexed baseline replays.
model = "results/manual_demonstration_autonomous_reaching/20261006-153139-grid_multi_demo_settings_raw/esn.toml"

[tracker]
# Tracking laws: "computed_torque" (cancels the arm's dynamics) or "pd" (joint PD).
laws = ["pd"]
# Natural frequencies of the tracking error (rad/s), critically damped. Joint PD:
# kp = omega^2, kd = 2 omega, scaled by each joint's inertia at the posture where
# the reach ends.
omegas = [10.0, 20.0, 40.0]
acceleration_filter = 0.02  # time constant of the low-pass filter on the reference acceleration (s)

[evaluation]
duration = 16.0        # task (s), after the warm-up; the demonstration lasts 14.8 s
hold = 2.0             # hold window after arrival (s): the hand must stay within the target tolerance
start_offsets_deg = [[0.0, 0.0]]  # the demonstrated start
effort_window = [4.1, 5.1]  # torque, effort, and force are measured from the block's onset for 1 s (s)

[disturbance]
type = "block"
onset = 4.1            # task time when the tip is gripped (s)
release = 4.6          # task time when it is let go (s)
stiffness = 20000.0    # N/m
damping = 100.0        # N s/m
