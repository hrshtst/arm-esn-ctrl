# Stage 1, Phase 4, with a demonstration taught by hand: sweep the ridge and the
# warm-up of the ESN trained on the take as recorded, with leak rate 0.5, spectral
# radius 0.6, and input scaling 1, one of the two most robust combinations of the
# sweeps of the three main parameters on either take (sweep_main_ridge_*.toml). On
# the take as recorded, at ridge 1, 0 of 169 runs fail and 74 first steps are over
# 30 mm (run 20261006-175503-sweep_main_ridge_1_raw).
#
#   uv run python experiments/sweep_esn.py experiments/manual_demonstration_autonomous_reaching/sweep_ridge_warmup_raw_lr0.5_sr0.6_is1.toml
#
# The ridge is searched on a logarithmic grid (Lukosevicius, A Practical Guide to
# Applying Echo State Networks, 2012, section 4.2). How long the reservoir needs to
# settle on the held start posture depends on its memory, so the warm-up is swept
# with it. The ranking is that of the first sweeps.

[demonstrations]
# A run directory of experiments/import_demonstrations.py, relative to the storage
# root: the reach taught by hand from one start posture (reach_manual_single.toml),
# as recorded (demo_00) and filtered by a first-order low-pass at 8 Hz (demo_00_filtered).
run = "results/demonstrations/20261006-152823-reach_manual_single"
train = ["demo_00.sklog.npz"]

[esn]
dt = 0.01              # sampling period (s)
warmup = 1.0           # swept: the held start posture drives the ESN this long before it moves (s)
n_neurons = 400
spectral_radius = 0.6
sparsity = 0.1         # fraction of nonzero reservoir connections
leak_rate = 0.5
input_scaling = 1
bias = true
ridge = 1.0            # swept
seed = 0

[sweep]
# The first two are the heatmap axes (x, then y).
ridge = [1e-8, 1e-6, 1e-4, 1e-2, 1.0, 10.0, 100.0]
warmup = [0.0, 0.25, 0.5, 1.0, 2.0, 4.0]

[ranking]
max_first_step = 0.03  # m: a first step longer than this is a jump, not a mild return

[evaluation]
duration = 16.0        # autonomous run (s); the demonstration lasts 14.8 s
hold = 2.0             # hold window after arrival (s): the hand must stay within the target tolerance
[evaluation.start_grid]
span_deg = 15.0        # the demonstrated start offset by -15 to 15 deg in each joint (169 start postures)
step_deg = 2.5
