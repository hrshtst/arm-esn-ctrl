[rules]
lead_deg = 10.0    # (b): a median lead near the path under this (deg)
path_deg = 30.0    # (c): an unstable fixed point within this of the take's joint path (deg) ...
release_s = 9.58   # ... or, held 4 s there and released, arriving later than the take does (s)
far_m = 0.1        # (a), apart from the rules: only attracting fixed points whose hand is this far off the target (m)

