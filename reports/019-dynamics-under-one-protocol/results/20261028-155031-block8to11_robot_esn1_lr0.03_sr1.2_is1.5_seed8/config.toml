# The consistent study's part 3, step 7, shown: the search's ESN #1 (leak rate 0.03,
# spectral radius 1.2, input scaling 1.5, seed 8), against the replay of the take by time
# and by the arm's progress, with the search's tracker, the tip held from 8 s to 11 s, one
# of step 7's blocks, from the take's start. See README.md.
#
#   uv run python experiments/robot_esn.py experiments/manual_demonstration_v2_consistent_dynamics/block8to11_robot_esn1_lr0.03_sr1.2_is1.5_seed8.toml

[esn]
# A trained ESN: esn.toml in a run directory of experiments/autonomous_esn.py, relative to the
# storage root. The take it was trained on is the one the replays replay.
model = "results/manual_demonstration_v2_consistent_search/20261024-205825-esn1_lr0.03_sr1.2_is1.5_seed8/esn.toml"

[tracker]
# The search's tracker: joint PD at omega = 20 rad/s and a damping ratio of 0.4, given
# the reference's velocity, its torque computed every 10 ms, the ESN's period, and
# held between.
laws = ["pd"]
omegas = [20.0]
dampings = [0.4]
acceleration_filter = 0.02  # time constant of the low-pass filter on the reference acceleration (s)
reference_velocity = true
control_period = 0.01  # the torque is computed this often and held between (s); the simulation step is 2 ms

[progress]
# A third arm, report 014's progress replay: the take replayed by time, but never more than
# lead_deg along its joint path past the arm's progress, the arm's nearest sample searched
# within window of the last one found.
lead_deg = 2.5
window = 1.0  # s

[evaluation]
duration = 30.0        # task (s), after the warm-up, as step 7's blocks
hold = 2.0             # hold window after arrival (s): the hand must stay within the target tolerance
start_offsets_deg = [[0.0, 0.0]]  # the take's start
effort_window = [8, 11.5]  # torque, effort, and force: from the block's onset to 0.5 s after its release (s)
return_tolerance = 0.005  # after a disturbance, the hand is back once within this of the taught path (m)
ringing_cutoff_hz = 1.5   # after a disturbance, the hand's motion above this is its ringing (Hz)
ringing_window = 2.0      # the ringing is measured over this long after the disturbance's end (s)
following_window = 0.5    # the following gain: from a disturbance's onset to this long after its end (s)

# Report 005's block, held 3 s.
[disturbance]
type = "block"
onset = 8.0            # task time when the tip is gripped (s)
release = 11.0          # task time when it is let go (s)
stiffness = 20000.0    # N/m
damping = 100.0        # N s/m
