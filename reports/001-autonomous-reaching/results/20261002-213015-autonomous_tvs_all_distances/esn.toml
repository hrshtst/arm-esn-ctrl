# A trained ESN of arm_esn_ctrl; load it with arm_esn_ctrl.esn.ReachingEsn.load(<this file>).
model = "esn.rclib"

[esn]
dt = 0.01
warmup = 0.25
n_neurons = 600
spectral_radius = 1.3
sparsity = 0.1
leak_rate = 0.05
input_scaling = 0.1
bias = true
ridge = 1e-06
seed = 0

[normalization]
center_rad = [
    0.842121364087264,
    1.52367243699105,
]
half_range_rad = [
    0.524471440224296,
    0.8499753457212386,
]
