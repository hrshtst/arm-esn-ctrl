# A trained ESN of arm_esn_ctrl; load it with arm_esn_ctrl.esn.ReachingEsn.load(<this file>).
model = "esn.rclib"

[esn]
dt = 0.01
warmup = 1.0
n_neurons = 400
spectral_radius = 1.35
sparsity = 0.05
leak_rate = 0.02
input_scaling = 0.05
bias = true
ridge = 0.01
seed = 7
teacher_noise_deg = 0.0
teacher_copies = 1
teacher_noise_exponent = 0.0
bias_scaling = 1.0

[normalization]
center_rad = [
    -0.07924893915041159,
    0.4320267037259393,
    1.2249057816063722,
    0.940268349748066,
]
half_range_rad = [
    0.2698119483417087,
    0.25748498437047873,
    0.17766173157091203,
    0.06757330045367654,
]
