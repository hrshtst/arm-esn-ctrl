# A trained ESN of arm_esn_ctrl; load it with arm_esn_ctrl.esn.ReachingEsn.load(<this file>).
model = "esn.rclib"
contexts = [
    "A",
    "B",
    "C",
]

[esn]
dt = 0.01
warmup = 1.0
n_neurons = 800
spectral_radius = 1.05
sparsity = 0.05
leak_rate = 0.17
input_scaling = 1.0
bias = true
ridge = 10.0
seed = 1
teacher_noise_deg = 0.0
teacher_copies = 1
teacher_noise_exponent = 0.0
bias_scaling = 1.0
context_scaling = 1.0
context_times_input_scaling = false

[normalization]
center_rad = [
    0.9494604892058094,
    1.7674694205888895,
]
half_range_rad = [
    2.0868302764041666,
    1.128890694557121,
]
