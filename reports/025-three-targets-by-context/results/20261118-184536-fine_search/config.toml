# The fine search: 81 settings around the coarse search's best (leak rate 0.1, spectral
# radius 1.2, input scaling 2, ridge 1), five reservoirs each (seeds 1 to 5). Each ESN is
# trained on the 27 takes of the three targets and run on the robot, undisturbed, from
# each take's start with the context of that take's target: 27 runs an ESN. Each
# setting is scored over the 135 runs of its five seeds by how many arrive and hold at
# the target their context names, then by their median detour ratio; the settings that
# hold in every run, at most the 20 best (the 20 best if none does), go on to
# untaught_search.toml. About 100 minutes with 15 workers. See README.md.
#
#   uv run python experiments/sweep_robot_esn.py \
#       experiments/manual_demonstration_v2_targets/fine_search.toml --workers 15

