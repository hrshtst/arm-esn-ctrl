# The damped search's validation (step 3): the chosen ESN
# (noise_white1deg_ridge4e-2_seed3_filtered.toml: report 007's chosen setting, leak
# rate 0.02, spectral radius 1.35, input scaling 2, trained with white noise of 1
# deg on the input at ridge 4e-2, seed 3) against the replay of the take, with joint
# PD at damping ratios 0.1, 0.4, and 0.8, given the reference's velocity, the change
# of the reference over each 10 ms period, so that the derivative term damps the
# velocity error, its torque computed every 10 ms and held between, while the arm is
# still simulated every 2 ms: undisturbed, from the demonstrated start and the 48
# offsets around it, -15 to 15 deg in each joint, every 5 deg (49 start postures).
# As report 008's offsets_robot_pd_reference_velocity_control10ms_filtered.toml
# otherwise.
#
#   uv run python experiments/robot_esn.py experiments/manual_demonstration_v2_robot_damped_search/offsets_robot_white1deg_seed3_reference_velocity_filtered.toml

[esn]
# A trained ESN: esn.toml in a run directory of experiments/autonomous_esn.py,
# relative to the storage root. The demonstration it was trained on (that run's
# [demonstrations]) is the one the time-indexed baseline replays.
model = "results/manual_demonstration_v2_robot_damped_search/20261014-000719-noise_white1deg_ridge4e-2_seed3_filtered/esn.toml"

[tracker]
# Joint PD at omega = 20 rad/s, at three damping ratios, given the reference's velocity.
laws = ["pd"]
omegas = [20.0]
dampings = [0.1, 0.4, 0.8]
acceleration_filter = 0.02  # time constant of the low-pass filter on the reference acceleration (s)
reference_velocity = true
control_period = 0.01  # the torque is computed this often and held between (s); the simulation step is 2 ms

[evaluation]
duration = 24.0        # task (s), after the warm-up, as in the study's sweeps; the take lasts 18.5 s
hold = 2.0             # hold window after arrival (s): the hand must stay within the target tolerance
start_offsets_deg = [[0.0, 0.0]]  # the demonstrated start first; then the grid below
[evaluation.start_grid]
span_deg = 15.0        # offsets from -15 to 15 deg, in every combination
step_deg = 5.0         # (49 start postures)

[plots]
# The joint angles and torques from these offset starts too, as reports 005 and 006
# showed: the largest offset, and the one from which report 005's ESN failed (deg).
offsets_deg = [[15.0, 15.0], [0.0, -10.0]]
